<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="記帳本">
<meta name="theme-color" content="#FAF6F0">
<title>記帳本</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23D97757'/%3E%3Ctext x='90' y='120' font-size='100' text-anchor='middle' fill='white' font-family='sans-serif'%3E$%3C/text%3E%3C/svg%3E">
<style>
  /* ===== CSS Variables ===== */
  :root {
    --bg: #FAF6F0;
    --bg-soft: #F2EBDF;
    --card: #FFFFFF;
    --ink: #2C2416;
    --ink-soft: #6B5D4A;
    --ink-faint: #A89980;
    --line: #E8DFD0;
    --accent: #D97757;
    --accent-soft: #F5E6DE;
    --income: #5C7A3D;
    --income-soft: #E8EFDD;
    --expense: #C44536;
    --expense-soft: #F8E0DC;
    --transfer: #4A6B8A;
    --transfer-soft: #DDE5EC;
    --shadow: 0 1px 3px rgba(44,36,22,0.06), 0 4px 12px rgba(44,36,22,0.04);
    --shadow-strong: 0 4px 16px rgba(44,36,22,0.12);
    --radius-card: 16px;
    --radius-btn: 12px;
    --radius-pill: 999px;
    --header-h: 56px;
    --tabbar-h: 76px;
  }

  /* ===== Reset ===== */
  *, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  html, body {
    margin: 0;
    padding: 0;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  input, textarea, select {
    -webkit-user-select: text;
    user-select: text;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
    padding-top: env(safe-area-inset-top, 0px);
  }
  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  button:active:not(:disabled) { transform: scale(0.95); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  input, select {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    border: 1px solid var(--line);
    border-radius: var(--radius-btn);
    padding: 10px 12px;
    background: var(--card);
    outline: none;
    font-variant-numeric: tabular-nums;
  }
  input:focus, select:focus { border-color: var(--accent); }

  /* ===== Layout ===== */
  #app {
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tabbar-h));
  }
  #header {
    position: sticky;
    top: 0;
    height: var(--header-h);
    background: rgba(250, 246, 240, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 10;
  }
  #main {
    padding: 16px;
    max-width: 640px;
    margin: 0 auto;
  }
  #tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: rgba(250, 246, 240, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--line);
    display: flex;
    z-index: 10;
  }
  #tabbar button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    color: var(--ink-faint);
    font-size: 11px;
    padding: 8px 0;
  }
  #tabbar button .icon { font-size: 22px; line-height: 1; }
  #tabbar button.active { color: var(--accent); }

  /* ===== Header components ===== */
  .book-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    padding: 7px 14px;
    font-weight: 600;
    color: var(--ink);
    max-width: 50vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .book-pill .caret { font-size: 10px; color: var(--ink-faint); }
  .month-switch {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--ink);
    font-weight: 600;
  }
  .month-switch button {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-pill);
    color: var(--ink-soft);
    font-size: 16px;
  }
  .month-switch button:active { background: var(--bg-soft); }
  .month-label { min-width: 86px; text-align: center; font-variant-numeric: tabular-nums; }

  /* ===== Sync badge ===== */
  .sync-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg-soft);
    color: var(--ink-soft);
    font-size: 14px;
    margin-left: 6px;
    flex-shrink: 0;
  }
  .sync-badge.ok       { background: var(--income-soft); color: var(--income); }
  .sync-badge.syncing  { background: var(--accent-soft); color: var(--accent); animation: spin 1.2s linear infinite; }
  .sync-badge.pending  { background: #FFF3CD; color: #856404; }
  .sync-badge.offline  { background: var(--bg-soft); color: var(--ink-faint); }
  .sync-badge.error    { background: var(--expense-soft); color: var(--expense); }
  .sync-badge.off      { display: none; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ===== Card ===== */
  .card {
    background: var(--card);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h3 {
    margin: 0 0 12px 0;
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  /* ===== Record view ===== */
  .type-switch {
    display: flex;
    background: var(--bg-soft);
    border-radius: var(--radius-pill);
    padding: 4px;
    margin-bottom: 14px;
  }
  .type-switch button {
    flex: 1;
    padding: 10px;
    border-radius: var(--radius-pill);
    color: var(--ink-soft);
    font-weight: 600;
  }
  .type-switch button.active.expense {
    background: var(--expense-soft);
    color: var(--expense);
  }
  .type-switch button.active.income {
    background: var(--income-soft);
    color: var(--income);
  }
  .type-switch button.active.transfer {
    background: var(--transfer-soft);
    color: var(--transfer);
  }
  .amount-display {
    text-align: center;
    font-size: 42px;
    font-weight: 700;
    padding: 18px 0;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .amount-display.expense { color: var(--expense); }
  .amount-display.income { color: var(--income); }
  .amount-display.transfer { color: var(--transfer); }
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .cat-btn {
    aspect-ratio: 1 / 1;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-btn);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 6px;
    transition: all 0.15s ease;
  }
  .cat-btn .emoji { font-size: 22px; line-height: 1; }
  .cat-btn .name { font-size: 11px; color: var(--ink-soft); }
  .cat-btn.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .cat-btn.selected .name { color: var(--ink); font-weight: 600; }
  .sub-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0 6px 0;
    margin: -4px 0 0 0;
    -webkit-overflow-scrolling: touch;
  }
  .sub-row::-webkit-scrollbar { display: none; }
  .sub-pill {
    flex-shrink: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    padding: 7px 14px;
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .sub-pill.selected {
    background: var(--ink);
    color: var(--card);
    border-color: var(--ink);
  }

  /* ===== Account chip row ===== */
  .acc-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0 6px 0;
    margin: -4px 0 0 0;
    -webkit-overflow-scrolling: touch;
  }
  .acc-row::-webkit-scrollbar { display: none; }
  .acc-chip {
    flex-shrink: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    padding: 7px 14px;
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .acc-chip.selected {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .acc-chip.transfer-selected {
    background: var(--transfer);
    color: white;
    border-color: var(--transfer);
  }
  .acc-chip.add {
    background: transparent;
    border-style: dashed;
    color: var(--accent);
  }
  .transfer-hint {
    margin-top: 8px;
    text-align: center;
    color: var(--expense);
    font-size: 12px;
  }

  .note-input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: var(--radius-btn);
    padding: 11px 12px;
    background: var(--card);
    font-size: 14px;
  }
  .date-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .date-row label { color: var(--ink-soft); font-size: 14px; }
  .date-row input[type="date"] {
    flex: 1;
    max-width: 200px;
    text-align: right;
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 6px;
    margin-top: 4px;
  }
  .keypad button {
    background: var(--card);
    border-radius: var(--radius-btn);
    font-size: 22px;
    font-weight: 500;
    height: 56px;
    box-shadow: 0 1px 2px rgba(44,36,22,0.04);
    color: var(--ink);
    padding: 0;
  }
  .keypad button:active:not(:disabled) { background: var(--bg-soft); }
  .keypad .key-fn { color: var(--ink-soft); font-size: 18px; }
  .keypad .key-op {
    background: var(--bg-soft);
    color: var(--accent);
    font-size: 24px;
    font-weight: 600;
  }
  .keypad .key-op:active:not(:disabled) { background: #EADFD3; }
  .keypad .key-save {
    grid-column: 5;
    grid-row: 1 / span 2;
    height: auto;
    background: var(--accent);
    color: white;
    font-size: 16px;
    font-weight: 600;
  }
  .keypad .key-save:active:not(:disabled) { background: #C8643E; }
  .keypad .key-save:disabled {
    background: var(--bg-soft);
    color: var(--ink-faint);
  }
  .keypad .key-back {
    grid-column: 5;
    grid-row: 3;
    background: var(--bg-soft);
    color: var(--ink-soft);
    font-size: 20px;
  }
  .keypad .key-equal {
    grid-column: 5;
    grid-row: 4;
    background: var(--accent);
    color: white;
    font-size: 24px;
    font-weight: 700;
  }
  .keypad .key-equal:active:not(:disabled) { background: #C8643E; }
  .keypad .key-equal:disabled {
    background: var(--bg-soft);
    color: var(--ink-faint);
  }

  /* ===== List view ===== */
  .summary-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border-radius: var(--radius-card);
    overflow: hidden;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
  }
  .summary-cell {
    background: var(--card);
    padding: 14px 8px;
    text-align: center;
  }
  .summary-cell .label {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .summary-cell .value {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .summary-cell.income .value { color: var(--income); }
  .summary-cell.expense .value { color: var(--expense); }
  .summary-cell.net .value { color: var(--ink); }
  .transfer-note {
    background: var(--transfer-soft);
    color: var(--transfer);
    border-radius: var(--radius-pill);
    padding: 8px 14px;
    font-size: 13px;
    text-align: center;
    margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }

  .day-group { margin-bottom: 14px; }
  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 4px 6px 4px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .day-header .date { font-weight: 600; color: var(--ink); }
  .day-header .total { font-variant-numeric: tabular-nums; }
  .entry-list {
    background: var(--card);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .entry-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .entry-item:last-child { border-bottom: none; }
  .entry-item:active { background: var(--bg-soft); }
  .entry-item.transfer { border-left: 3px solid var(--transfer); }
  .entry-emoji {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  .entry-item.transfer .entry-emoji { color: var(--transfer); }
  .entry-body {
    flex: 1;
    min-width: 0;
  }
  .entry-title {
    font-size: 14px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-note {
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-tag {
    display: inline-block;
    background: var(--bg-soft);
    color: var(--ink-soft);
    border-radius: var(--radius-pill);
    padding: 1px 8px;
    font-size: 11px;
    margin-left: 4px;
  }
  .entry-amount {
    flex-shrink: 0;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .entry-amount.expense { color: var(--expense); }
  .entry-amount.income { color: var(--income); }
  .entry-amount.transfer { color: var(--transfer); }

  .empty-state {
    text-align: center;
    color: var(--ink-faint);
    padding: 60px 20px;
    font-size: 14px;
  }
  .empty-state .icon { font-size: 36px; margin-bottom: 8px; opacity: 0.6; }

  /* ===== Stats view ===== */
  .stat-row {
    margin-bottom: 12px;
  }
  .stat-row:last-child { margin-bottom: 0; }
  .stat-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .stat-head .label {
    flex: 1;
    font-size: 14px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-head .amount {
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    font-weight: 600;
  }
  .stat-head .percent {
    font-size: 12px;
    color: var(--ink-faint);
    min-width: 36px;
    text-align: right;
  }
  .stat-bar {
    height: 6px;
    background: var(--bg-soft);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: var(--radius-pill);
    transition: width 0.3s ease;
  }
  .stat-bar-fill.income { background: var(--income); }
  .stat-bar-fill.expense { background: var(--expense); }
  .stat-bar-fill.transfer { background: var(--transfer); }

  .sub-stats {
    margin: 8px 0 4px 28px;
    padding: 8px 12px;
    background: var(--bg-soft);
    border-radius: var(--radius-btn);
  }
  .sub-stat-item {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--ink-soft);
    padding: 3px 0;
  }
  .balance-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 14px;
  }
  .balance-row:last-child { border-bottom: none; }
  .balance-row .label {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ink);
  }
  .balance-row .label .meta {
    font-size: 11px;
    color: var(--ink-faint);
  }
  .balance-row .amt {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 15px;
  }
  .balance-total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    margin-top: 4px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--ink-soft);
  }
  .balance-total-row .amt {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--ink);
  }

  .transfer-stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 13px;
  }
  .transfer-stat-row:last-child { border-bottom: none; }
  .transfer-stat-row .flow {
    flex: 1;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .transfer-stat-row .purpose {
    color: var(--ink-faint);
    font-size: 12px;
  }
  .transfer-stat-row .amt {
    color: var(--transfer);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .transfer-total-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    padding: 10px 0 2px 0;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .transfer-total-row .amt {
    color: var(--transfer);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* ===== Settings view ===== */
  .setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    gap: 12px;
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-label {
    flex: 1;
    min-width: 0;
  }
  .setting-label .title { color: var(--ink); font-size: 14px; }
  .setting-label .desc { color: var(--ink-faint); font-size: 12px; margin-top: 2px; }
  .btn {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-btn);
    padding: 8px 14px;
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
  }
  .btn:active { background: var(--line); }
  .btn-primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .btn-primary:active { background: #C8643E; }
  .btn-transfer {
    background: var(--transfer);
    color: white;
    border-color: var(--transfer);
  }
  .btn-danger {
    background: var(--expense-soft);
    color: var(--expense);
    border-color: transparent;
  }
  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border-color: var(--line);
  }

  /* ===== Modal ===== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(44, 36, 22, 0.35);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s ease;
  }
  .modal-backdrop.top { z-index: 120; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal {
    width: 100%;

<script>
'use strict';

/* ===================================================
 * 分類定義（支出與收入）
 * id 是英文識別碼，用於 entries 內部儲存
 * name 是中文顯示名，emoji 是圖示

 * =================================================== */
const CATS = {

    { id: 'sport',     name: '運動', emoji: '🏃', subs: null },

    { id: 'parttime',  name: '兼職',   emoji: '⚒️', subs: null },

    { id: 'subsidy',   name: '補助',   emoji: '🏛️', subs: ['政府','空軍官校','其他'] },
    { id: 'invest_in', name: '投資收入', emoji: '📈', subs: ['股息','利息','資本利得'] },
    { id: 'refund',    name: '退稅',   emoji: '💵', subs: null },
    { id: 'lend_back', name: '代墊回歸', emoji: '🪙', subs: ['爸爸','媽媽','公司','其他'] },
    { id: 'other_in',  name: '其他',   emoji: '➕', subs: null }
  ]
};

/* ===================================================
 * 帳戶類型定義
 * =================================================== */
const ACCOUNT_TYPES = [
  { id: 'checking',   name: '活存',   emoji: '💳' },
  { id: 'savings',    name: '儲蓄',   emoji: '🏦' },
  { id: 'cash',       name: '現金',   emoji: '💵' },
  { id: 'credit',     name: '信用卡', emoji: '💳' },
  { id: 'investment', name: '投資',   emoji: '📈' },
  { id: 'lend',       name: '代墊',   emoji: '🤝' }
];
const ACCOUNT_TYPE_MAP = Object.fromEntries(ACCOUNT_TYPES.map(t => [t.id, t]));

/* ===================================================
 * 轉帳目的標籤（建議清單，使用者點選即可）
 * =================================================== */
const TRANSFER_PURPOSES = ['儲蓄撥款', '信用卡還款', '投資匯入', '還款', '其他'];

const WEEKDAY_TC = ['日','一','二','三','四','五','六'];

/* ===================================================
 * State 與持久化
 * =================================================== */
const STORAGE_KEY = 'ledger_v1';
const STORAGE_KEY_SYNC = 'ledger_sync_v1';
const APP_VERSION = '1.6';
const MAX_QUEUE_TRIES = 5;
const MAX_NOTE_LEN = 50;
const MAX_AMOUNT_DIGITS = 7;
const AUTO_PULL_INTERVAL_MS = 5 * 60 * 1000;
const MIN_PULL_GAP_MS = 60 * 1000;

const state = {
  books: ['我自己', '媽媽'],
  currentBook: '我自己',
  entries: { '我自己': [], '媽媽': [] },
  customSubcategories: {},
  accounts: [
    { id: 'acc_cash', name: '現金', type: 'cash', isDefault: true }
  ],
  schedules: [],
  // 雲端同步狀態（持久化於另一個 storage key）
  sync: {
    endpointUrl: '',
    apiSecret: '',
    enabled: false,
    lastSyncedAt: 0,
    lastPulledAt: 0,
    lastPullSummary: null,
    lastError: null,
    pendingQueue: [],   // [{op, payload, tries, queuedAt}]
    failed: [],         // [{op, payload, _error}]
    _flushing: false,
    _pulling: false,
    _pinging: false,
    _online: typeof navigator !== 'undefined' ? navigator.onLine : true,
    _badge: 'off'       // off | ok | syncing | pending | offline | error
  },
  // UI state（不持久化）
  ui: {
    tab: 'record',
    viewMonth: todayISO().slice(0, 7), // YYYY-MM
    draft: emptyDraft(),
    editingEntryId: null,
    scheduleCheckScheduled: false
  }
};

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function emptyDraft() {
  return {
    type: 'expense',
    amount: 0,
    expr: '',               // 計算機表達式（含 + − × ÷ 時為非空）
    category: null,
    subcategory: null,
    note: '',
    date: todayISO(),
    account: null,          // expense/income 用
    fromAccount: null,      // transfer 用
    toAccount: null,        // transfer 用
    transferPurpose: null   // transfer 用
  };
}

// 計算機：安全評估表達式（只接受數字 + 基本運算符）
function evalExpression(expr) {
  if (!expr || !String(expr).trim()) return 0;
  // 將顯示符號轉成 JS 運算符
  let norm = String(expr).replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
  // 移除末尾未完成的運算符
  norm = norm.replace(/[+\-*/.]+$/, '').trim();
  if (!norm) return 0;
  // 嚴格白名單：只准數字、運算符、小數點、空白
  if (!/^[\d+\-*/.\s]+$/.test(norm)) return NaN;
  try {
    const r = Function('"use strict";return (' + norm + ')')();
    if (typeof r !== 'number' || !isFinite(r)) return NaN;
    return Math.max(0, Math.round(r));
  } catch (e) {
    return NaN;
  }
}

// 載入 state 並做 v1.0 → v1.1 migration
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);

    if (Array.isArray(data.books) && data.books.length) state.books = data.books;
    if (typeof data.currentBook === 'string' && state.books.includes(data.currentBook)) {
      state.currentBook = data.currentBook;
    } else {
      state.currentBook = state.books[0];
    }

    state.entries = {};
    for (const b of state.books) {
      state.entries[b] = Array.isArray(data.entries?.[b]) ? data.entries[b] : [];
    }

    if (data.customSubcategories && typeof data.customSubcategories === 'object') {
      state.customSubcategories = data.customSubcategories;
    }

    // v1.0 → v1.1 migration：accounts
    if (Array.isArray(data.accounts) && data.accounts.length) {
      state.accounts = data.accounts;
    }
    // schedules
    if (Array.isArray(data.schedules)) state.schedules = data.schedules;

    // 簡化：若同時存在預設的「主活存」+「現金」且都未被改過，合併為單一「現金」
    maybeSimplifyDefaultAccounts();

    // 預設帳戶（用於既有 entry 補欄位）
    const defAcc = getDefaultAccount();
    const defAccId = defAcc ? defAcc.id : (state.accounts[0]?.id || 'acc_cash');

    // 既有 entries 若沒有 account / type，補預設值
    for (const book of state.books) {
      state.entries[book] = (state.entries[book] || []).map(e => {
        const out = { ...e };
        if (!out.type) {
          out.type = (out.amount > 0 && out.category) ? 'expense' : (out.type || 'expense');
        }
        // 轉帳項目不需要 account
        if (out.type !== 'transfer' && !out.account) {
          out.account = defAccId;
        }
        return out;
      });
    }

    saveState();
  } catch (err) {
    console.error('載入資料失敗', err);
    toast('資料載入失敗，已重置為預設');
  }
}

function saveState() {
  try {
    const payload = {
      books: state.books,
      currentBook: state.currentBook,
      entries: state.entries,
      customSubcategories: state.customSubcategories,
      accounts: state.accounts,
      schedules: state.schedules
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (err) {
    console.error('儲存失敗', err);
    toast('儲存失敗，請檢查瀏覽器空間');
  }
}

/* ===================================================
 * 雲端同步狀態的持久化（與主資料分檔）
 * =================================================== */
function loadSyncState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_SYNC);
    if (!raw) return;
    const data = JSON.parse(raw);
    state.sync.endpointUrl  = typeof data.endpointUrl === 'string' ? data.endpointUrl : '';
    state.sync.apiSecret    = typeof data.apiSecret === 'string' ? data.apiSecret : '';
    state.sync.enabled      = !!data.enabled;
    state.sync.lastSyncedAt = Number(data.lastSyncedAt) || 0;
    state.sync.lastPulledAt = Number(data.lastPulledAt) || 0;
    state.sync.lastPullSummary = data.lastPullSummary || null;
    state.sync.lastError    = data.lastError || null;
    state.sync.pendingQueue = Array.isArray(data.pendingQueue) ? data.pendingQueue : [];
    state.sync.failed       = Array.isArray(data.failed) ? data.failed : [];
  } catch (err) {
    console.error('載入同步設定失敗', err);
  }
}

function saveSyncState() {
  try {
    const payload = {
      endpointUrl: state.sync.endpointUrl,
      apiSecret: state.sync.apiSecret,
      enabled: state.sync.enabled,
      lastSyncedAt: state.sync.lastSyncedAt,
      lastPulledAt: state.sync.lastPulledAt,
      lastPullSummary: state.sync.lastPullSummary,
      lastError: state.sync.lastError,
      pendingQueue: state.sync.pendingQueue,
      failed: state.sync.failed
    };
    localStorage.setItem(STORAGE_KEY_SYNC, JSON.stringify(payload));
  } catch (err) {
    console.error('儲存同步設定失敗', err);
  }
}

/* ===================================================
 * 雲端對映：PWA 內部結構（英文 id）↔ Sheet 結構（中文）
 * =================================================== */
function typeToChinese(t) {
  return t === 'expense' ? '支出' : (t === 'income' ? '收入' : (t === 'transfer' ? '轉帳' : ''));
}
function chineseToType(s) {
  return s === '支出' ? 'expense' : (s === '收入' ? 'income' : (s === '轉帳' ? 'transfer' : null));
}
function catIdToName(type, id) {
  if (!id) return '';
  const cat = findCat(type, id);
  return cat ? cat.name : id;
}
function catNameToId(type, name) {
  if (!name) return null;
  const cat = findCatByName(type, name);
  return cat ? cat.id : null;
}
function accountIdToName(id) {
  if (!id) return '';
  const acc = findAccount(id);
  return acc ? acc.name : id;
}
function accountNameToId(name) {
  if (!name) return null;
  const acc = findAccountByName(name);
  return acc ? acc.id : null;
}

// 把 entry 加上 book 後轉成 Apps Script 接受的 payload
function toCloudPayload(entry, book) {
  const out = {
    id: entry.id,
    date: entry.date,
    type: typeToChinese(entry.type),
    amount: entry.amount,
    book: book || state.currentBook,
    note: entry.note || '',
    createdAt: entry.createdAt || Date.now(),
    updatedAt: entry.updatedAt || entry.createdAt || Date.now(),
    scheduleId: entry.scheduleId || ''
  };
  if (entry.type === 'transfer') {
    out.fromAccount = accountIdToName(entry.fromAccount) || '';
    out.toAccount   = accountIdToName(entry.toAccount) || '';
    // transferPurpose 併入 note（Sheet 沒這欄）
    if (entry.transferPurpose) {
      out.note = `(${entry.transferPurpose})${out.note ? ' ' + out.note : ''}`;
    }
  } else {
    out.category    = catIdToName(entry.type, entry.category) || '';
    out.subcategory = entry.subcategory || '';
    out.account     = accountIdToName(entry.account) || '';
  }
  return out;
}

// 找包含某 entry id 的 book，沒找到回 null
function findBookOfEntry(id) {
  for (const b of state.books) {
    if ((state.entries[b] || []).some(e => e.id === id)) return b;
  }
  return null;
}

/* ===================================================
 * 雲端同步核心
 * =================================================== */
function syncEnabled() {
  return !!(state.sync.enabled && state.sync.endpointUrl && state.sync.apiSecret);
}

function syncDispatch(op, payload) {
  if (!syncEnabled()) return;
  state.sync.pendingQueue.push({ op, payload, tries: 0, queuedAt: Date.now() });
  saveSyncState();
  updateSyncBadge();
  if (navigator.onLine) flushQueue();
}

function opToAction(op) {
  return ({ append: 'appendEntry', update: 'updateEntry', delete: 'deleteEntry' })[op];
}

async function sendToEndpoint(item) {
  const body = {
    secret: state.sync.apiSecret,
    action: opToAction(item.op),
    payload: item.payload
  };
  const res = await fetch(state.sync.endpointUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    redirect: 'follow'
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

async function flushQueue() {
  if (!syncEnabled()) return;
  if (state.sync._flushing) return;
  if (!navigator.onLine) return;
  state.sync._flushing = true;
  updateSyncBadge();
  try {
    while (state.sync.pendingQueue.length > 0) {
      const item = state.sync.pendingQueue[0];
      try {
        const data = await sendToEndpoint(item);
        if (data.ok) {
          state.sync.pendingQueue.shift();
          state.sync.lastSyncedAt = Date.now();
          state.sync.lastError = null;
        } else {
          // 業務錯誤（duplicate id / not found 等）→ 標 failed，不無限重試
          item._error = data.error;
          state.sync.failed.push(state.sync.pendingQueue.shift());
          state.sync.lastError = data.error;
        }
        saveSyncState();
        updateSyncBadge();
      } catch (err) {
        // 網路/伺服器錯誤 → 視次數重試或進 failed
        item.tries = (item.tries || 0) + 1;
        if (item.tries >= MAX_QUEUE_TRIES) {
          item._error = err.message || 'network error';
          state.sync.failed.push(state.sync.pendingQueue.shift());
        }
        state.sync.lastError = err.message || 'network error';
        saveSyncState();
        updateSyncBadge();
        break;
      }
    }
  } finally {
    state.sync._flushing = false;
    updateSyncBadge();
  }
}

async function fetchRemoteEntries() {
  const res = await fetch(state.sync.endpointUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      secret: state.sync.apiSecret,
      action: 'getEntries',
      payload: {}
    }),
    redirect: 'follow'
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (!(data && data.ok)) throw new Error((data && data.error) || '雲端拉取失敗');
  return (data.data && data.data.entries) || [];
}

function protectedSyncIds() {
  const ids = new Set();
  for (const item of [...state.sync.pendingQueue, ...state.sync.failed]) {
    const id = item && item.payload && item.payload.id;
    if (id) ids.add(id);
  }
  return ids;
}

function ensureCloudAccount(name, counters) {
  if (!name) return null;
  const existing = findAccountByName(name);
  if (existing) return existing.id;
  const newAcc = { id: genId('acc'), name, type: 'cash' };
  state.accounts.push(newAcc);
  counters.newAccounts++;
  return newAcc.id;
}

function cloudRowToLocal(row, counters) {
  const type = chineseToType(row.type);
  if (!type || !row.id || !row.date) return null;
  const book = row.book || state.currentBook;
  if (!state.books.includes(book)) {
    state.books.push(book);
    state.entries[book] = state.entries[book] || [];
    counters.newBooks++;
  }
  const e = {
    id: row.id,
    type,
    amount: Number(row.amount) || 0,
    date: row.date,
    note: row.note || '',
    createdAt: Number(row.createdAt) || 0,
    updatedAt: Number(row.updatedAt) || Number(row.createdAt) || 0,
    scheduleId: row.scheduleId || undefined
  };
  if (type === 'transfer') {
    e.fromAccount = ensureCloudAccount(row.fromAccount, counters);
    e.toAccount = ensureCloudAccount(row.toAccount, counters);
  } else {
    const catId = catNameToId(type, row.category);
    e.category = catId || (type === 'expense' ? 'other' : 'other_in');
    e.subcategory = row.subcategory || null;
    e.account = ensureCloudAccount(row.account, counters);
  }
  return { book, entry: e };
}

function ensureDefaultAccount() {
  if (!state.accounts.some(a => a.isDefault && !a.archived)) {
    const first = getActiveAccounts()[0];
    if (first) first.isDefault = true;
  }
}

function mergeRemoteEntries(entries) {
  if (!window.LedgerSyncCore) throw new Error('同步模組未載入');
  const counters = { newAccounts: 0, newBooks: 0 };
  const remoteItems = [];
  for (const row of entries) {
    const item = cloudRowToLocal(row, counters);
    if (item) remoteItems.push(item);
  }
  const result = window.LedgerSyncCore.mergeEntries(
    state.entries,
    remoteItems,
    protectedSyncIds()
  );
  state.entries = result.entriesByBook;
  for (const book of state.books) state.entries[book] = state.entries[book] || [];
  ensureDefaultAccount();
  saveState();
  return { ...result, ...counters, remoteTotal: entries.length };
}

async function syncNow({ showToast = false, force = false } = {}) {
  if (!syncEnabled() || !navigator.onLine || state.sync._pulling || state.sync._flushing) return null;
  if (!force && Date.now() - state.sync.lastPulledAt < MIN_PULL_GAP_MS) return null;

  if (showToast) toast('雙向同步中…');
  await flushQueue();
  if (state.sync.pendingQueue.length > 0) {
    if (showToast) toast('尚有資料未上傳，稍後再拉取');
    return null;
  }

  state.sync._pulling = true;
  updateSyncBadge();
  try {
    const entries = await fetchRemoteEntries();
    const summary = mergeRemoteEntries(entries);
    const now = Date.now();
    state.sync.lastPulledAt = now;
    state.sync.lastSyncedAt = now;
    state.sync.lastPullSummary = summary;
    if (state.sync.failed.length === 0) state.sync.lastError = null;
    saveSyncState();
    renderHeader();
    renderMain();
    if (showToast) {
      toast(`✅ 同步完成：新增 ${summary.added}、更新 ${summary.updated}、保留本機 ${summary.protected}`);
    }
    return summary;
  } catch (err) {
    state.sync.lastError = err.message || '同步失敗';
    saveSyncState();
    if (showToast) toast('❌ 同步失敗：' + state.sync.lastError);
    return null;
  } finally {
    state.sync._pulling = false;
    updateSyncBadge();
  }
}

async function pingEndpoint(url, secret) {
  // 用 POST 比 GET 更貼近實際呼叫（且驗 secret）
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ secret, action: 'ping' }),
      redirect: 'follow'
    });
    if (!res.ok) return { ok: false, error: 'HTTP ' + res.status };
    return await res.json();
  } catch (err) {
    return { ok: false, error: err.message || 'fetch failed' };
  }
}

async function getRemoteCount(url, secret) {
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ secret, action: 'getEntries', payload: { limit: 1 } }),
      redirect: 'follow'
    });
    if (!res.ok) return -1;
    const d = await res.json();
    return d && d.ok && d.data ? Number(d.data.count) || 0 : -1;
  } catch (err) {
    return -1;
  }
}

function countAllEntries() {
  let n = 0;
  for (const b of state.books) n += (state.entries[b] || []).length;
  return n;
}

function collectAllEntriesWithBook() {
  const out = [];
  for (const b of state.books) {
    for (const e of (state.entries[b] || [])) out.push({ entry: e, book: b });
  }
  return out;
}

/* ===================================================

function genId(prefix) {
  const base = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  return prefix ? `${prefix}_${base}` : base;
}

function formatMoney(n) {
  return Math.abs(n).toLocaleString('en-US');
}

function findCat(type, id) {
  return CATS[type]?.find(c => c.id === id) || null;
}

function findCatByName(type, name) {
  return CATS[type]?.find(c => c.name === name) || null;
}

function getSubcategories(type, catId) {
  const cat = findCat(type, catId);
  if (!cat) return [];
  const builtIn = cat.subs || [];
  const custom = state.customSubcategories[catId] || [];
  return [...builtIn, ...custom];
}

function ymOfDate(iso) { return iso.slice(0, 7); }

function shiftMonth(ym, delta) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function isoToParts(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return { y, m, d, weekday: WEEKDAY_TC[dt.getDay()] };
}

function getMonthEntries(book, ym) {
  const list = state.entries[book] || [];
  return list.filter(e => e.date && e.date.startsWith(ym));
}

function escapeHTML(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function findAccountByName(name) {

function countEntriesUsingAccount(accId) {
  let n = 0;
  for (const book of state.books) {
    for (const e of (state.entries[book] || [])) {
      if (e.account === accId || e.fromAccount === accId || e.toAccount === accId) n++;
    }

  return n;
}

// 簡化預設帳戶：若仍是 v1.1 初版的「主活存 + 現金」配置且都未被使用者改過，
// 把所有引用 acc_main 的紀錄與排程改指向 acc_cash，並移除 acc_main。
function maybeSimplifyDefaultAccounts() {
  const main = state.accounts.find(a => a.id === 'acc_main');
  const cash = state.accounts.find(a => a.id === 'acc_cash');
  if (!main || !cash) return;
  // 只有「都還是預設外觀」才合併，使用者改過名/銀行/用途就不動
  const mainIsDefault = main.name === '主活存' && !main.bank && !main.purpose;
  const cashIsDefault = cash.name === '現金';
  if (!mainIsDefault || !cashIsDefault) return;

  for (const book of state.books) {
    state.entries[book] = (state.entries[book] || []).map(e => {
      const out = { ...e };
      if (out.account === 'acc_main') out.account = 'acc_cash';
      if (out.fromAccount === 'acc_main') out.fromAccount = 'acc_cash';
      if (out.toAccount === 'acc_main') out.toAccount = 'acc_cash';
      return out;
    });
  }
  state.schedules = (state.schedules || []).map(s => {
    const out = { ...s };
    if (out.account === 'acc_main') out.account = 'acc_cash';
    if (out.fromAccount === 'acc_main') out.fromAccount = 'acc_cash';
    if (out.toAccount === 'acc_main') out.toAccount = 'acc_cash';
    return out;
  });
  state.accounts = state.accounts.filter(a => a.id !== 'acc_main');
  cash.isDefault = true;
}

/* ===================================================
 * 排程 helpers
 * =================================================== */
// 將某月某日對應到該月實際存在的日（31 在 2 月 → 該月最後一天）
function clampDayToMonth(y, m0, day) {
  const lastDay = new Date(y, m0 + 1, 0).getDate();
  return Math.min(day, lastDay);
}

// 初始 nextDue：從 fromISO（預設今天）起，找下個（含當天）符合 dayOfMonth 的日期
function computeInitialNextDue(dayOfMonth, fromISO) {
  const fromIso = fromISO || todayISO();
  const from = new Date(fromIso + 'T00:00:00');
  let y = from.getFullYear();
  let m0 = from.getMonth();
  let day = clampDayToMonth(y, m0, dayOfMonth);
  let cand = new Date(y, m0, day);
  if (cand < from) {
    m0++;
    if (m0 > 11) { y++; m0 -= 12; }
    day = clampDayToMonth(y, m0, dayOfMonth);
  }
  return `${y}-${String(m0+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

// 執行排程後推進 nextDue 到下個月對應日
function advanceNextDue(currentNextDue, dayOfMonth) {
  const d = new Date((currentNextDue || todayISO()) + 'T00:00:00');
  let y = d.getFullYear();
  let m0 = d.getMonth() + 1;
  if (m0 > 11) { y++; m0 -= 12; }
  const day = clampDayToMonth(y, m0, dayOfMonth);
  return `${y}-${String(m0+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

// 檢查所有到期排程；若有則彈出第一個 modal
function checkScheduleDue() {
  if (document.querySelector('.modal-backdrop')) {
    // 有別的 modal 開著就先等
    state.ui.scheduleCheckScheduled = true;
    return;
  }
  state.ui.scheduleCheckScheduled = false;
  const today = todayISO();
  const due = state.schedules.find(s => s.active && s.nextDue && s.nextDue <= today);
  if (due) {
    openScheduleDueModal(due);
  }
}

/* ===================================================
 * Toast
 * =================================================== */
function toast(message) {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  root.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 250);
  }, 1800);
}

/* ===================================================
 * Modal helper
 * =================================================== */
function openModal(contentHTML, opts = {}) {
  closeModal();
  const root = document.getElementById('modal-root');
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop' + (opts.top ? ' top' : '');
  backdrop.innerHTML = `<div class="modal" role="dialog">${contentHTML}</div>`;
  root.appendChild(backdrop);
  if (!opts.lockBackdrop) {
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) closeModal();
    });
  }
  return backdrop.querySelector('.modal');
}

function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
  // 若關閉一個 modal 後，還有等待中的排程檢查，補執行
  if (state.ui.scheduleCheckScheduled) {
    setTimeout(checkScheduleDue, 50);
  }
}

function computeSyncBadge() {
  if (!syncEnabled()) {
    return { cls: 'off', icon: '', title: '雲端同步未啟用' };
  }
  if (!navigator.onLine) {
    return { cls: 'offline', icon: '⊘', title: '離線中' };
  }
  if (state.sync._flushing || state.sync._pulling) {
    return { cls: 'syncing', icon: '⟳', title: '同步中…' };
  }
  if (state.sync.pendingQueue.length > 0) {
    return { cls: 'pending', icon: '⚠', title: `待同步 ${state.sync.pendingQueue.length} 筆` };
  }
  if (state.sync.lastError) {
    return { cls: 'error', icon: '✕', title: '上次同步失敗：' + state.sync.lastError };
  }
  return { cls: 'ok', icon: '✓', title: '已同步' };
}

function updateSyncBadge() {
  const btn = document.getElementById('btn-sync-badge');
  if (!btn) return;
  const b = computeSyncBadge();
  btn.className = 'sync-badge ' + b.cls;
  btn.title = b.title;
  btn.setAttribute('aria-label', b.title);
  btn.textContent = b.icon;
  // 設定頁狀態列也跟著更新
  const stat = document.getElementById('sync-status-line');
  if (stat) stat.innerHTML = syncStatusLineHTML();
}

function syncStatusLineHTML() {
  const b = computeSyncBadge();
  let icon, color, text;
  if (!syncEnabled()) {
    icon = '🔘'; color = 'var(--ink-faint)'; text = '尚未設定（填入下方 URL 與 Secret）';
  } else if (!navigator.onLine) {
    icon = '⊘'; color = 'var(--ink-faint)'; text = '目前離線，恢復連線後自動補送';
  } else if (state.sync._flushing || state.sync._pulling) {
    icon = '⟳'; color = 'var(--accent)'; text = '同步中…';
  } else if (state.sync.pendingQueue.length > 0) {
    icon = '⚠'; color = '#856404'; text = `待同步 ${state.sync.pendingQueue.length} 筆`;
  } else if (state.sync.lastError) {
    icon = '✕'; color = 'var(--expense)'; text = '上次失敗：' + escapeHTML(state.sync.lastError);
  } else if (state.sync.lastSyncedAt) {
    icon = '✓'; color = 'var(--income)';
    const diff = Math.round((Date.now() - state.sync.lastSyncedAt) / 60000);
    text = `已連線 · 上次同步：${diff <= 0 ? '剛剛' : diff + ' 分鐘前'}`;
  } else {
    icon = '✓'; color = 'var(--income)'; text = '已連線';
  }
  return `<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:${color}">
    <span style="font-size:16px">${icon}</span>
    <span>${text}</span>
  </div>`;
}

 * =================================================== */
function renderRecordHTML() {
  const d = state.ui.draft;

  // 確保 draft 帳戶有效（若帳戶被封存或不存在，回退預設）
  ensureDraftAccountsValid(d);

  const type = d.type;
  const amountActiveCls = (type === 'expense') ? 'expense' : (type === 'income') ? 'income' : 'transfer';
  const sign = (type === 'expense') ? '-' : (type === 'income') ? '+' : '';
  // 若 expr 含運算符（+ − × ÷），直接顯示表達式；否則顯示最終金額
  const hasOperator = d.expr && /[+\-×÷]/.test(d.expr);
  let amountText;
  if (hasOperator) {
    amountText = d.expr;
  } else if (d.amount > 0) {
    amountText = `${sign}$${formatMoney(d.amount)}`;
  } else {
    amountText = '$0';
  }

  // canSave 判斷
  let canSave = false;
  if (d.amount > 0) {
    if (type === 'expense' || type === 'income') {
      canSave = !!d.category && !!d.account;
    } else if (type === 'transfer') {
      canSave = !!d.fromAccount && !!d.toAccount && d.fromAccount !== d.toAccount;
    }
  }

  const typeSwitchHTML = `
    <div class="type-switch">
      <button class="${type === 'expense'  ? 'active expense'  : ''}" data-type="expense">支出</button>
      <button class="${type === 'income'   ? 'active income'   : ''}" data-type="income">收入</button>
      <button class="${type === 'transfer' ? 'active transfer' : ''}" data-type="transfer">轉帳</button>
    </div>
  `;

  const amountHTML = `
    <div class="card" style="padding:8px 16px">
      <div class="amount-display ${d.amount > 0 ? amountActiveCls : ''}">${amountText}</div>
    </div>
  `;

  let middleHTML = '';
  if (type === 'transfer') {
    middleHTML = renderTransferMiddleHTML(d);
  } else {
    middleHTML = renderExpenseIncomeMiddleHTML(d, type);
  }

  const noteHTML = `
    <div class="card">
      <input class="note-input" id="note-input" type="text"
             placeholder="備註(可選)" maxlength="${MAX_NOTE_LEN}"
             value="${escapeHTML(d.note)}">
    </div>
  `;

  const dateHTML = `

      <div class="date-row">
        <label>日期</label>
        <input type="date" id="date-input" value="${d.date}">
      </div>

  // 快速建立定期扣款（必須先填好金額與必要欄位才會啟用）

      <div style="font-size:13px;color:var(--ink-soft);line-height:1.4">
        💡 想每月自動建立這筆？<br>
        <span style="color:var(--ink-faint);font-size:11px">設定後到了該日，PWA 會自動彈出確認</span>
      </div>
      <button class="btn ${d.type === 'transfer' ? 'btn-transfer' : 'btn-primary'}" id="btn-make-recurring" ${canSave ? '' : 'disabled'}>設為每月定期</button>
    </div>
  `;

  // 計算機模式：有 expr 且能解析時，= 鍵可用
  const canEval = d.expr && /[+\-×÷]/.test(d.expr) && isFinite(evalExpression(d.expr));
  const keypadHTML = `
    <div class="keypad" id="keypad">
      <button data-k="7">7</button>
      <button data-k="8">8</button>
      <button data-k="9">9</button>
      <button class="key-op" data-k="÷">÷</button>

function ensureDraftAccountsValid(d) {
  const def = getDefaultAccount();
  const defId = def ? def.id : null;
  if (d.type === 'transfer') {
    if (d.fromAccount && !findAccount(d.fromAccount)) d.fromAccount = null;
    if (d.toAccount && !findAccount(d.toAccount)) d.toAccount = null;
    if (!d.fromAccount && defId) d.fromAccount = defId;
    // toAccount 不自動填，避免一開始就 from===to；交由使用者選
    if (d.fromAccount && d.toAccount === d.fromAccount) d.toAccount = null;
  } else {
    if (d.account && !findAccount(d.account)) d.account = null;
    if (!d.account && defId) d.account = defId;
  }
}

function renderExpenseIncomeMiddleHTML(d, type) {
  const list = CATS[type];
  const catsHTML = list.map(c => `
    <button class="cat-btn ${d.category === c.id ? 'selected' : ''}" data-cat="${c.id}">
      <span class="emoji">${c.emoji}</span>
      <span class="name">${escapeHTML(c.name)}</span>
    </button>
  `).join('');

  let subsHTML = '';
  const cat = findCat(type, d.category);
  const subs = d.category ? getSubcategories(type, d.category) : [];
  if (cat && subs.length) {

      <div class="card">
        <h3>細項標籤</h3>
        <div class="sub-row">
          ${subs.map(s => `
            <button class="sub-pill ${d.subcategory === s ? 'selected' : ''}" data-sub="${escapeHTML(s)}">${escapeHTML(s)}</button>

  }

  // 帳戶 chip 列
  const active = getActiveAccounts();
  const accChipsHTML = active.map(a => `
    <button class="acc-chip ${d.account === a.id ? 'selected' : ''}" data-acc="${a.id}">
      <span>${getAccountIcon(a.type)}</span>
      <span>${escapeHTML(a.name)}</span>

function renderTransferMiddleHTML(d) {

function bindRecordEvents() {
  const d = state.ui.draft;

  // 收支/轉帳切換
  document.querySelectorAll('.type-switch button[data-type]').forEach(b => {
    b.addEventListener('click', () => {
      const t = b.dataset.type;
      if (d.type === t) return;
      switchDraftType(d, t);
      renderMain();
    });
  });

  // 大分類
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.cat;
      if (d.category === id) {
        d.category = null;
        d.subcategory = null;
      } else {
        d.category = id;
        d.subcategory = null;
      }
      renderMain();
    });
  });

  // 細項
  document.querySelectorAll('.sub-pill[data-sub]').forEach(b => {
    b.addEventListener('click', () => {
      const s = b.dataset.sub;
      d.subcategory = (d.subcategory === s) ? null : s;
      renderMain();
    });
  });

  // 帳戶 chip（expense/income）
  document.querySelectorAll('.acc-chip[data-acc]').forEach(b => {
    b.addEventListener('click', () => {
      d.account = b.dataset.acc;
      renderMain();
    });
  });

  // 從帳戶（transfer）
  document.querySelectorAll('.acc-chip[data-from]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.from;
      d.fromAccount = id;
      if (d.toAccount === id) d.toAccount = null;
      renderMain();
    });
  });

  // 到帳戶（transfer）
  document.querySelectorAll('.acc-chip[data-to]').forEach(b => {
    if (b.disabled) return;
    b.addEventListener('click', () => {
      d.toAccount = b.dataset.to;
      renderMain();
    });
  });

  // 目的標籤
  document.querySelectorAll('.sub-pill[data-purpose]').forEach(b => {
    b.addEventListener('click', () => {
      const p = b.dataset.purpose;
      d.transferPurpose = (d.transferPurpose === p) ? null : p;
      renderMain();
    });
  });

  // 「＋ 新增」帳戶 — 從哪一行按的，新建好就自動填到那行
  document.querySelectorAll('[data-acc-add]').forEach(b => {
    b.addEventListener('click', () => {
      const target = b.dataset.accAdd; // 'from' | 'to' | 'account'
      openAccountEditor(null, (newAccId) => {
        if (newAccId) {
          if (target === 'from') {
            d.fromAccount = newAccId;
            if (d.toAccount === newAccId) d.toAccount = null;
          } else if (target === 'to') {
            d.toAccount = newAccId;
            if (d.fromAccount === newAccId) d.fromAccount = null;
          } else if (target === 'account') {
            d.account = newAccId;
          }
        }
        renderMain();
      });
    });
  });

  // 備註
  const noteEl = document.getElementById('note-input');
  if (noteEl) {
    noteEl.addEventListener('input', () => {
      d.note = noteEl.value.slice(0, MAX_NOTE_LEN);
    });
  }

  // 日期
  const dateEl = document.getElementById('date-input');
  if (dateEl) {
    dateEl.addEventListener('change', () => {
      if (dateEl.value) d.date = dateEl.value;
    });
  }

  // 快速建立定期扣款
  const recurBtn = document.getElementById('btn-make-recurring');
  if (recurBtn) {
    recurBtn.addEventListener('click', () => {
      if (recurBtn.disabled) return;
      openScheduleFromDraft();
    });
  }

  // 鍵盤
  document.querySelectorAll('#keypad button').forEach(b => {
    b.addEventListener('click', () => handleKeypad(b.dataset.k));
  });
}

// 由當前記帳頁 draft 開啟「新增定期扣款」編輯器，預填欄位
function openScheduleFromDraft() {
  const d = state.ui.draft;
  const todayDay = new Date().getDate();
  const dayOfMonth = (() => {
    const dt = new Date((d.date || todayISO()) + 'T00:00:00');
    const day = dt.getDate();
    return Number.isFinite(day) && day >= 1 && day <= 31 ? day : todayDay;
  })();

  const template = {
    type: d.type,
    amount: d.amount || 0,
    dayOfMonth,
    book: state.currentBook,
    note: d.note || '',
    active: true
  };
  if (d.type === 'transfer') {
    template.fromAccount = d.fromAccount || null;
    template.toAccount = d.toAccount || null;
    template.transferPurpose = d.transferPurpose || null;
  } else {
    template.account = d.account || null;
    template.category = d.category || null;
    template.subcategory = d.subcategory || null;
  }
  openScheduleEditor(null, () => { renderMain(); }, template);
}

// 收支類型切換 draft 的欄位處理
function switchDraftType(d, newType) {
  const prevType = d.type;
  d.type = newType;
  if (newType === 'transfer') {
    // 進入轉帳：保留金額、備註、日期；清分類；fromAccount 取原 account
    const def = getDefaultAccount();
    d.fromAccount = d.account || (def ? def.id : null);
    d.toAccount = null;
    d.transferPurpose = null;
    d.category = null;
    d.subcategory = null;
  } else if (prevType === 'transfer') {
    // 從轉帳離開：account 取 fromAccount
    d.account = d.fromAccount || (getDefaultAccount()?.id || null);
    d.fromAccount = null;
    d.toAccount = null;
    d.transferPurpose = null;
    d.category = null;
    d.subcategory = null;
  } else {
    // expense ↔ income：清分類
    d.category = null;
    d.subcategory = null;
  }
}

function handleKeypad(k) {
  const d = state.ui.draft;
  if (typeof d.expr !== 'string') d.expr = '';

  const OPS = ['+', '-', '−', '×', '÷'];

  if (k === 'save') {
    // 儲存前先把表達式算完
    if (d.expr) {
      const r = evalExpression(d.expr);
      if (isFinite(r)) d.amount = r;
      d.expr = '';
    }
    saveEntry();
    return;
  }

  if (k === '=') {
    if (d.expr) {
      const r = evalExpression(d.expr);
      if (isFinite(r) && String(r).length <= MAX_AMOUNT_DIGITS) {
        d.amount = r;
        d.expr = '';
      }
    }
    renderMain();
    return;
  }

  if (k === 'clear') {
    d.amount = 0;
    d.expr = '';
    renderMain();
    return;
  }

  if (k === 'back') {
    if (d.expr) {
      d.expr = d.expr.slice(0, -1);
      const lastChar = d.expr.slice(-1);
      if (d.expr && !OPS.includes(lastChar)) {
        const r = evalExpression(d.expr);
        if (isFinite(r)) d.amount = r;
      } else if (!d.expr) {
        d.amount = 0;
      }
    } else {
      d.amount = Math.floor(d.amount / 10);
    }
    renderMain();
    return;
  }

  // 運算符：+ − × ÷
  if (OPS.includes(k)) {
    if (!d.expr) {
      if (d.amount > 0) d.expr = String(d.amount) + k;
      else d.expr = '0' + k;
    } else {
      const lastChar = d.expr.slice(-1);
      if (OPS.includes(lastChar)) {
        d.expr = d.expr.slice(0, -1) + k;
      } else {
        d.expr = d.expr + k;
      }
    }
    renderMain();
    return;
  }

  if (k === '00') {
    if (d.expr) {
      const lastChar = d.expr.slice(-1);
      if (!OPS.includes(lastChar)) {
        d.expr = d.expr + '00';
        const r = evalExpression(d.expr);
        if (isFinite(r) && String(r).length <= MAX_AMOUNT_DIGITS) d.amount = r;
      }
    } else {
      const next = d.amount * 100;
      if (String(next).length <= MAX_AMOUNT_DIGITS) d.amount = next;
    }
    renderMain();
    return;
  }

  // 純數字 0-9
  const digit = parseInt(k, 10);
  if (Number.isNaN(digit)) {
    renderMain();
    return;
  }
  if (d.expr) {
    d.expr = d.expr + k;
    const r = evalExpression(d.expr);
    if (isFinite(r) && String(r).length <= MAX_AMOUNT_DIGITS) d.amount = r;
  } else {
    const next = d.amount * 10 + digit;
    if (String(next).length <= MAX_AMOUNT_DIGITS) d.amount = next;
  }
  renderMain();
}

function saveEntry() {
  const d = state.ui.draft;
  if (!(d.amount > 0)) return;

  let entry;
  if (d.type === 'transfer') {
    if (!d.fromAccount || !d.toAccount || d.fromAccount === d.toAccount) return;
    entry = {
      id: genId(),
      type: 'transfer',
      amount: d.amount,
      fromAccount: d.fromAccount,
      toAccount: d.toAccount,
      transferPurpose: d.transferPurpose || null,
      note: (d.note || '').slice(0, MAX_NOTE_LEN),
      date: d.date,
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
  } else {
    if (!d.category || !d.account) return;
    entry = {
      id: genId(),
      type: d.type,
      amount: d.amount,
      category: d.category,
      subcategory: d.subcategory,
      account: d.account,
      note: (d.note || '').slice(0, MAX_NOTE_LEN),
      date: d.date,
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
  }

  state.entries[state.currentBook].push(entry);
  saveState();
  syncDispatch('append', toCloudPayload(entry, state.currentBook));

  if (d.type === 'transfer') {
    toast(`已轉帳 $${formatMoney(d.amount)}`);
  } else {
    const sign = d.type === 'expense' ? '−' : '+';
    toast(`已記錄 ${sign}$${formatMoney(d.amount)}`);
  }

  // 重置金額、備註；保留類型、分類、帳戶
  d.amount = 0;
  d.note = '';
  d.subcategory = null;
  d.transferPurpose = null;
  renderMain();
}

/* ===================================================
 * List view
 * =================================================== */
function renderListHTML() {
  const ym = state.ui.viewMonth;
  const entries = getMonthEntries(state.currentBook, ym);

  let income = 0, expense = 0, transfer = 0;
  entries.forEach(e => {
    if (e.type === 'income') income += e.amount;
    else if (e.type === 'expense') expense += e.amount;
    else if (e.type === 'transfer') transfer += e.amount;
  });
  const net = income - expense;

  const summaryHTML = `
    <div class="summary-row">
      <div class="summary-cell income">
        <div class="label">收入</div>
        <div class="value">+${formatMoney(income)}</div>
      </div>
      <div class="summary-cell expense">
        <div class="label">支出</div>
        <div class="value">−${formatMoney(expense)}</div>
      </div>
      <div class="summary-cell net">
        <div class="label">淨額</div>
        <div class="value">${net >= 0 ? '+' : '−'}${formatMoney(net)}</div>
      </div>
    </div>
    ${transfer > 0 ? `<div class="transfer-note">↔️ 本月轉帳 NT$ ${formatMoney(transfer)}（不計入收支）</div>` : ''}
  `;

  if (entries.length === 0) {
    return summaryHTML + `
      <div class="empty-state">
        <div class="icon">📓</div>
        <div>本月還沒有紀錄，從「記帳」分頁開始吧</div>
      </div>
    `;
  }

  // 依日期分組
  const groups = {};
  entries.forEach(e => {
    if (!groups[e.date]) groups[e.date] = [];
    groups[e.date].push(e);
  });
  const sortedDates = Object.keys(groups).sort().reverse();

  const groupsHTML = sortedDates.map(date => {
    const list = groups[date].slice().sort((a, b) => b.createdAt - a.createdAt);
    let dayExpense = 0, dayIncome = 0, dayTransfer = 0;
    list.forEach(e => {
      if (e.type === 'expense') dayExpense += e.amount;
      else if (e.type === 'income') dayIncome += e.amount;
      else if (e.type === 'transfer') dayTransfer += e.amount;
    });
    const { m, d, weekday } = isoToParts(date);
    const parts = [];
    if (dayExpense > 0) parts.push(`支出 ${formatMoney(dayExpense)}`);
    if (dayIncome > 0) parts.push(`收入 ${formatMoney(dayIncome)}`);
    if (dayTransfer > 0) parts.push(`轉帳 ${formatMoney(dayTransfer)}`);
    const totalText = parts.join(' · ');

    const itemsHTML = list.map(e => renderEntryItemHTML(e)).join('');

    return `
      <div class="day-group">
        <div class="day-header">
          <span><span class="date">${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}</span> 週${weekday}</span>
          <span class="total">${totalText}</span>
        </div>
        <div class="entry-list">${itemsHTML}</div>
      </div>
    `;
  }).join('');

  return summaryHTML + groupsHTML;
}

function renderEntryItemHTML(e) {
  if (e.type === 'transfer') {
    const from = findAccount(e.fromAccount);
    const to = findAccount(e.toAccount);
    const fromName = from ? from.name : (e.fromAccount || '?');
    const toName = to ? to.name : (e.toAccount || '?');
    const purpose = e.transferPurpose ? `${escapeHTML(e.transferPurpose)}` : '';
    const noteText = e.note || '';
    const meta = [purpose, escapeHTML(noteText)].filter(Boolean).join(' · ');
    const schedTag = e.scheduleId ? '<span class="entry-tag">排程</span>' : '';
    return `
      <div class="entry-item transfer" data-id="${e.id}">
        <div class="entry-emoji">↔️</div>
        <div class="entry-body">
          <div class="entry-title">${escapeHTML(fromName)} → ${escapeHTML(toName)}${schedTag}</div>
          ${meta ? `<div class="entry-note">${meta}</div>` : ''}
        </div>
        <div class="entry-amount transfer">${formatMoney(e.amount)}</div>
      </div>
    `;
  }
  const cat = findCat(e.type, e.category);
  const emoji = cat?.emoji || '•';
  const catName = cat?.name || '未知';
  const subText = e.subcategory ? ` · ${escapeHTML(e.subcategory)}` : '';
  const acc = findAccount(e.account);
  const accText = acc ? `<span class="entry-tag">${getAccountIcon(acc.type)} ${escapeHTML(acc.name)}</span>` : '';
  const schedTag = e.scheduleId ? '<span class="entry-tag">排程</span>' : '';
  const sign = e.type === 'expense' ? '−' : '+';
  const cls = e.type === 'expense' ? 'expense' : 'income';
  const noteHTML = (e.note || '') ? `<div class="entry-note">${escapeHTML(e.note)}</div>` : '';
  return `
    <div class="entry-item" data-id="${e.id}">
      <div class="entry-emoji">${emoji}</div>
      <div class="entry-body">
        <div class="entry-title">${escapeHTML(catName)}${subText}${accText}${schedTag}</div>
        ${noteHTML}
      </div>
      <div class="entry-amount ${cls}">${sign}${formatMoney(e.amount)}</div>
    </div>
  `;
}

function bindListEvents() {
  document.querySelectorAll('.entry-item').forEach(el => {
    el.addEventListener('click', () => openEntryEditor(el.dataset.id));
  });
}

/* ===================================================
 * 編輯 entry modal
 * =================================================== */
function findEntry(id) {
  for (const book of state.books) {
    const idx = state.entries[book]?.findIndex(e => e.id === id);
    if (idx >= 0) return { book, idx, entry: state.entries[book][idx] };
  }
  return null;
}

function openEntryEditor(id, workingOverride) {
  const found = findEntry(id);
  if (!found) return;
  const original = found.entry;
  // working copy：所有修改只在 working 上累積，按「儲存」才寫回 original
  const working = workingOverride || { ...original };

  const type = working.type;
  const active = getActiveAccounts();

  const typeBtns = `
    <div class="type-switch" style="margin:0">
      <button class="${type === 'expense' ? 'active expense' : ''}" data-edit-type="expense">支出</button>
      <button class="${type === 'income' ? 'active income' : ''}" data-edit-type="income">收入</button>
      <button class="${type === 'transfer' ? 'active transfer' : ''}" data-edit-type="transfer">轉帳</button>
    </div>
  `;

  let bodyHTML = '';
  if (type === 'transfer') {
    const fromOptions = active.map(a => `<option value="${a.id}" ${a.id === working.fromAccount ? 'selected' : ''}>${getAccountIcon(a.type)} ${escapeHTML(a.name)}</option>`).join('');
    const toOptions = active.map(a => `<option value="${a.id}" ${a.id === working.toAccount ? 'selected' : ''}>${getAccountIcon(a.type)} ${escapeHTML(a.name)}</option>`).join('');
    const purposeOptions = `<option value="">（無）</option>` + TRANSFER_PURPOSES.map(p =>
      `<option value="${escapeHTML(p)}" ${p === working.transferPurpose ? 'selected' : ''}>${escapeHTML(p)}</option>`
    ).join('');
    bodyHTML = `
      <div class="form-field">
        <label>從帳戶</label>
        <select id="edit-from">${fromOptions}</select>
      </div>
      <div class="form-field">
        <label>到帳戶</label>
        <select id="edit-to">${toOptions}</select>
      </div>
      <div class="form-field">
        <label>目的</label>
        <select id="edit-purpose">${purposeOptions}</select>
      </div>
    `;
  } else {
    const cats = CATS[type];
    const subs = getSubcategories(type, working.category);
    const catOptions = cats.map(c => `<option value="${c.id}" ${c.id === working.category ? 'selected' : ''}>${c.emoji} ${escapeHTML(c.name)}</option>`).join('');
    const subOptions = subs.length
      ? `<option value="">（無）</option>` + subs.map(s => `<option value="${escapeHTML(s)}" ${s === working.subcategory ? 'selected' : ''}>${escapeHTML(s)}</option>`).join('')
      : '';
    const accOptions = active.map(a => `<option value="${a.id}" ${a.id === working.account ? 'selected' : ''}>${getAccountIcon(a.type)} ${escapeHTML(a.name)}</option>`).join('');
    bodyHTML = `
      <div class="form-field">
        <label>分類</label>
        <select id="edit-cat">${catOptions}</select>
      </div>
      <div class="form-field" id="edit-sub-wrap" ${subs.length ? '' : 'style="display:none"'}>
        <label>細項</label>
        <select id="edit-sub">${subOptions}</select>
      </div>
      <div class="form-field">
        <label>帳戶</label>
        <select id="edit-account">${accOptions}</select>
      </div>
    `;
  }

  const html = `
    <div class="modal-title">編輯紀錄</div>
    <div class="form-field">
      <label>類型</label>
      ${typeBtns}
    </div>
    <div class="form-field">
      <label>金額</label>
      <input id="edit-amount" type="number" inputmode="numeric" value="${working.amount}" min="1" max="9999999">
    </div>
    ${bodyHTML}
    <div class="form-field">
      <label>備註</label>
      <input id="edit-note" type="text" maxlength="${MAX_NOTE_LEN}" value="${escapeHTML(working.note || '')}">
    </div>
    <div class="form-field">
      <label>日期</label>
      <input id="edit-date" type="date" value="${working.date}">
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="edit-delete">刪除</button>
      <button class="btn" id="edit-cancel">取消</button>
      <button class="btn btn-primary" id="edit-save">儲存</button>
    </div>
  `;
  const modal = openModal(html);

  function collectFromForm() {
    const baseAmount = parseInt(modal.querySelector('#edit-amount').value, 10) || 0;
    const note = modal.querySelector('#edit-note').value;
    const date = modal.querySelector('#edit-date').value || working.date;
    if (type === 'transfer') {
      return {
        amount: baseAmount,
        note, date,
        fromAccount: modal.querySelector('#edit-from').value,
        toAccount: modal.querySelector('#edit-to').value,
        transferPurpose: modal.querySelector('#edit-purpose').value || null
      };
    }
    return {
      amount: baseAmount,
      note, date,
      category: modal.querySelector('#edit-cat').value || working.category,
      subcategory: (modal.querySelector('#edit-sub') && modal.querySelector('#edit-sub').value) || null,
      account: modal.querySelector('#edit-account').value || working.account
    };
  }

  // 切換類型：依當前狀態組新 working、重開 modal
  modal.querySelectorAll('[data-edit-type]').forEach(b => {
    b.addEventListener('click', () => {
      const t = b.dataset.editType;
      if (t === working.type) return;
      const cur = collectFromForm();
      const newWorking = { ...working, ...cur, type: t };
      if (t === 'transfer') {
        // 支出/收入 → 轉帳
        const def = getDefaultAccount();
        newWorking.fromAccount = working.account || (def ? def.id : null);
        newWorking.toAccount = null;
        newWorking.transferPurpose = null;
        delete newWorking.category;
        delete newWorking.subcategory;
        delete newWorking.account;
      } else if (working.type === 'transfer') {
        // 轉帳 → 支出/收入
        newWorking.account = working.fromAccount || (getDefaultAccount()?.id || null);
        newWorking.category = CATS[t][0].id;
        newWorking.subcategory = null;
        delete newWorking.fromAccount;
        delete newWorking.toAccount;
        delete newWorking.transferPurpose;
      } else {
        // 支出 ↔ 收入
        newWorking.category = CATS[t][0].id;
        newWorking.subcategory = null;
      }
      openEntryEditor(id, newWorking);
    });
  });

  // 切換分類 → 重填細項
  const catEl = modal.querySelector('#edit-cat');
  if (catEl) {
    catEl.addEventListener('change', (ev) => {
      const newCatId = ev.target.value;
      const newSubs = getSubcategories(working.type, newCatId);
      const wrap = modal.querySelector('#edit-sub-wrap');
      if (newSubs.length) {
        wrap.style.display = '';
        const sel = modal.querySelector('#edit-sub');
        sel.innerHTML = `<option value="">（無）</option>` + newSubs.map(s => `<option value="${escapeHTML(s)}">${escapeHTML(s)}</option>`).join('');
      } else {
        wrap.style.display = 'none';
      }
    });
  }

  modal.querySelector('#edit-cancel').addEventListener('click', closeModal);

  modal.querySelector('#edit-save').addEventListener('click', () => {
    const cur = collectFromForm();
    if (!(cur.amount > 0) || cur.amount > 9999999) {
      toast('金額需為 1 到 9999999');
      return;
    }
    if (working.type === 'transfer') {
      if (!cur.fromAccount || !cur.toAccount) { toast('請選擇從/到帳戶'); return; }
      if (cur.fromAccount === cur.toAccount) { toast('從與到帳戶不可相同'); return; }
      // 改寫到 original
      Object.assign(original, {
        type: 'transfer',
        amount: cur.amount,
        fromAccount: cur.fromAccount,
        toAccount: cur.toAccount,
        transferPurpose: cur.transferPurpose,
        note: (cur.note || '').slice(0, MAX_NOTE_LEN),
        date: cur.date
      });
      delete original.category;
      delete original.subcategory;
      delete original.account;
    } else {
      if (!cur.category) { toast('請選擇分類'); return; }
      if (!cur.account) { toast('請選擇帳戶'); return; }
      Object.assign(original, {
        type: working.type,
        amount: cur.amount,
        category: cur.category,
        subcategory: cur.subcategory,
        account: cur.account,
        note: (cur.note || '').slice(0, MAX_NOTE_LEN),
        date: cur.date
      });
      delete original.fromAccount;
      delete original.toAccount;
      delete original.transferPurpose;
    }
    original.updatedAt = Date.now();
    saveState();
    syncDispatch('update', toCloudPayload(original, found.book));
    closeModal();
    toast('已更新');
    renderMain();
  });

  modal.querySelector('#edit-delete').addEventListener('click', () => {
    openConfirm('確定要刪除這筆紀錄嗎？', () => {
      const found2 = findEntry(id);
      if (found2) {
        const removedId = found2.entry.id;
        state.entries[found2.book].splice(found2.idx, 1);
        saveState();
        syncDispatch('delete', { id: removedId });
        toast('已刪除');
        renderMain();
      }
    });
  });
}

function openConfirm(message, onYes) {
  const html = `
    <div class="modal-title">${escapeHTML(message)}</div>
    <div class="modal-actions">
      <button class="btn" id="confirm-no">取消</button>
      <button class="btn btn-danger" id="confirm-yes">確認</button>
    </div>
  `;
  const modal = openModal(html, { top: true });
  modal.querySelector('#confirm-no').addEventListener('click', closeModal);
  modal.querySelector('#confirm-yes').addEventListener('click', () => {
    closeModal();
    onYes();
  });
}

/* ===================================================
 * Stats view
 * =================================================== */
function computeAccountBalances(book) {
  const list = state.entries[book] || [];
  const balances = {};
  for (const a of state.accounts) balances[a.id] = 0;
  for (const e of list) {
    if (e.type === 'income' && e.account != null) {
      balances[e.account] = (balances[e.account] || 0) + e.amount;
    } else if (e.type === 'expense' && e.account != null) {
      balances[e.account] = (balances[e.account] || 0) - e.amount;
    } else if (e.type === 'transfer') {
      if (e.fromAccount != null) balances[e.fromAccount] = (balances[e.fromAccount] || 0) - e.amount;
      if (e.toAccount   != null) balances[e.toAccount]   = (balances[e.toAccount]   || 0) + e.amount;
    }
  }
  return balances;
}

function renderAccountBalancesHTML() {
  const list = state.entries[state.currentBook] || [];
  if (!list.length) return '';
  const balances = computeAccountBalances(state.currentBook);
  // 列出有交易過的所有帳戶（含已封存），讓使用者看得到歷史餘額
  const accIds = Object.keys(balances).filter(id => {
    const acc = findAccount(id);
    if (!acc) return false;
    return balances[id] !== 0 || !acc.archived;
  });
  if (!accIds.length) return '';

  // 排序：未封存優先、餘額由大到小
  accIds.sort((a, b) => {
    const A = findAccount(a), B = findAccount(b);
    const archDiff = (A.archived ? 1 : 0) - (B.archived ? 1 : 0);
    if (archDiff !== 0) return archDiff;
    return balances[b] - balances[a];
  });

  const rows = accIds.map(id => {
    const acc = findAccount(id);
    const bal = balances[id];
    const sign = bal > 0 ? '+' : (bal < 0 ? '−' : '');
    const cls = bal > 0 ? 'text-income' : (bal < 0 ? 'text-expense' : '');
    const archived = acc.archived ? '<span class="meta">(已封存)</span>' : '';
    return `
      <div class="balance-row" data-acc-detail="${id}" style="cursor:pointer">
        <span class="label">
          <span>${getAccountIcon(acc.type)}</span>
          <span>${escapeHTML(acc.name)}</span>
          ${archived}
        </span>
        <span class="amt ${cls}">${sign}${formatMoney(bal)} <span style="color:var(--ink-faint);font-weight:400;font-size:12px;margin-left:4px">›</span></span>
      </div>
    `;
  }).join('');

  const total = accIds.reduce((s, id) => s + balances[id], 0);
  const totalSign = total > 0 ? '+' : (total < 0 ? '−' : '');

  return `
    <div class="card">
      <h3>帳戶餘額（本帳本累計）</h3>
      ${rows}
      <div class="balance-total-row">
        <span>合計</span>
        <span class="amt">${totalSign}${formatMoney(total)}</span>
      </div>
    </div>
  `;
}

function renderStatsHTML() {
  const balanceHTML = renderAccountBalancesHTML();
  const ym = state.ui.viewMonth;
  const entries = getMonthEntries(state.currentBook, ym);

  if (entries.length === 0) {
    return balanceHTML + `
      <div class="empty-state">
        <div class="icon">📊</div>
        <div>本月還沒有資料，記一筆看看吧</div>
      </div>
    `;
  }

  const expenseHTML = renderStatsGroup(entries, 'expense', '本月支出分類');
  const incomeHTML = renderStatsGroup(entries, 'income', '本月收入分類');
  const transferHTML = renderTransferStatsHTML(entries);

  const monthly = (expenseHTML + incomeHTML + transferHTML);
  if (!monthly) {
    return balanceHTML + `
      <div class="empty-state">
        <div class="icon">📊</div>
        <div>本月還沒有可統計的資料</div>
      </div>
    `;
  }
  return balanceHTML + monthly;
}

function renderStatsGroup(entries, type, title) {
  const list = entries.filter(e => e.type === type);
  if (!list.length) return '';

  const byCat = {};
  list.forEach(e => {
    if (!byCat[e.category]) byCat[e.category] = { total: 0, subs: {} };
    byCat[e.category].total += e.amount;
    const subKey = e.subcategory || '(無細項)';
    byCat[e.category].subs[subKey] = (byCat[e.category].subs[subKey] || 0) + e.amount;
  });

  const grandTotal = Object.values(byCat).reduce((s, c) => s + c.total, 0);
  if (grandTotal === 0) return '';

  const rows = Object.entries(byCat)
    .sort((a, b) => b[1].total - a[1].total)
    .map(([catId, data]) => {
      const cat = findCat(type, catId);
      const emoji = cat?.emoji || '•';
      const name = cat?.name || catId;
      const pct = (data.total / grandTotal * 100);
      const pctText = pct.toFixed(pct < 10 ? 1 : 0) + '%';
      const sign = type === 'expense' ? '−' : '+';
      const cls = type === 'expense' ? 'expense' : 'income';
      const subEntries = Object.entries(data.subs).sort((a,b) => b[1] - a[1]);
      const hasMultipleSubs = subEntries.length > 1 || (subEntries[0] && subEntries[0][0] !== '(無細項)');
      const subHTML = hasMultipleSubs ? `
        <div class="sub-stats hidden" data-sub-of="${catId}">
          ${subEntries.map(([sub, amt]) => `
            <div class="sub-stat-item">
              <span>${escapeHTML(sub)}</span>
              <span>${sign}${formatMoney(amt)}</span>
            </div>
          `).join('')}
        </div>
      ` : '';

      return `
        <div class="stat-row">
          <div class="stat-head" data-cat="${catId}" data-has-subs="${hasMultipleSubs}">
            <span class="label"><span>${emoji}</span><span>${escapeHTML(name)}</span></span>
            <span class="amount ${cls === 'expense' ? 'text-expense' : 'text-income'}">${sign}${formatMoney(data.total)}</span>
            <span class="percent">${pctText}</span>
          </div>
          <div class="stat-bar">
            <div class="stat-bar-fill ${cls}" style="width:${Math.min(100, pct)}%"></div>
          </div>
          ${subHTML}
        </div>
      `;
    }).join('');

  return `
    <div class="card">
      <h3>${title}（合計 ${formatMoney(grandTotal)}）</h3>
      ${rows}
    </div>
  `;
}

function renderTransferStatsHTML(entries) {
  const list = entries.filter(e => e.type === 'transfer');
  if (!list.length) return '';
  const total = list.reduce((s, e) => s + e.amount, 0);
  const rowsHTML = list
    .slice()
    .sort((a, b) => b.createdAt - a.createdAt)
    .map(e => {
      const from = findAccount(e.fromAccount);
      const to = findAccount(e.toAccount);
      const fromName = from ? from.name : (e.fromAccount || '?');
      const toName = to ? to.name : (e.toAccount || '?');
      const purpose = e.transferPurpose ? `<span class="purpose">(${escapeHTML(e.transferPurpose)})</span>` : '';
      return `
        <div class="transfer-stat-row">
          <div class="flow">↔️ ${escapeHTML(fromName)} → ${escapeHTML(toName)} ${purpose}</div>
          <div class="amt">${formatMoney(e.amount)}</div>
        </div>
      `;
    }).join('');
  return `
    <div class="card">
      <h3>本月轉帳明細</h3>
      ${rowsHTML}
      <div class="transfer-total-row">共 <span class="amt">${formatMoney(total)}</span></div>
    </div>
  `;
}

function bindStatsEvents() {
  document.querySelectorAll('.stat-head').forEach(el => {
    if (el.dataset.hasSubs !== 'true') return;
