/* ===================================================
 * 帳戶明細 modal — 跨所有帳本列出該帳戶的所有紀錄
 * 餘額是跨帳本累計（夢想帳戶等共用蓄水池場景）
 * 每筆紀錄顯示來自哪本帳本
 * =================================================== */
function openAccountDetailModal(accId) {
  const acc = findAccount(accId);
  if (!acc) return;

  // 從所有帳本收集牽涉到該帳戶的紀錄
  const allEntries = [];
  for (const book of state.books) {
    for (const e of (state.entries[book] || [])) {
      if (e.account === accId || e.fromAccount === accId || e.toAccount === accId) {
        allEntries.push({ ...e, _book: book });
      }
    }
  }
  allEntries.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt - a.createdAt));

  // 計算總餘額 + 每本帳本各自貢獻
  let totalBalance = 0;
  const bookBalances = {};
  for (const book of state.books) bookBalances[book] = 0;
  for (const e of allEntries) {
    let delta = 0;
    if (e.type === 'income' && e.account === accId) delta = e.amount;
    else if (e.type === 'expense' && e.account === accId) delta = -e.amount;
    else if (e.type === 'transfer') {
      if (e.toAccount === accId) delta += e.amount;
      if (e.fromAccount === accId) delta -= e.amount;
    }
    totalBalance += delta;
    bookBalances[e._book] = (bookBalances[e._book] || 0) + delta;
  }

  const balColor = totalBalance > 0 ? 'var(--income)' : (totalBalance < 0 ? 'var(--expense)' : 'var(--ink)');
  const balSign = totalBalance > 0 ? '+' : (totalBalance < 0 ? '−' : '');

  // 多本帳本都有貢獻時顯示分解（共用蓄水池）
  const booksWithActivity = state.books.filter(b => bookBalances[b] !== 0);
  let contribHTML = '';
  if (booksWithActivity.length > 1) {
    const chips = booksWithActivity.map(b => {
      const v = bookBalances[b];
      const s = v > 0 ? '+' : (v < 0 ? '−' : '');
      const color = v > 0 ? 'var(--income)' : (v < 0 ? 'var(--expense)' : 'var(--ink-faint)');
      return `<div style="display:inline-flex;align-items:center;gap:6px;background:var(--bg-soft);border-radius:var(--radius-pill);padding:4px 10px;margin:2px;font-size:12px">
        <span style="color:var(--ink-soft)">${escapeHTML(b)}</span>
        <span style="color:${color};font-weight:600;font-variant-numeric:tabular-nums">${s}${formatMoney(v)}</span>
      </div>`;
    }).join('');
    contribHTML = `<div style="margin-top:8px">${chips}</div>`;
  }

  const scopeLabel = booksWithActivity.length > 1 ? '跨帳本累計' : (booksWithActivity.length === 1 ? `${booksWithActivity[0]} 累計` : '尚無紀錄');

  const entriesHTML = allEntries.length
    ? `<div class="entry-list">${allEntries.map(e => renderAccountDetailEntry(e, accId, true)).join('')}</div>`
    : '<div class="empty-state" style="padding:30px 10px;font-size:13px">這個帳戶還沒有紀錄</div>';

  const html = `
    <div class="modal-title">
      ${getAccountIcon(acc.type)} ${escapeHTML(acc.name)}
      ${acc.archived ? '<span style="color:var(--ink-faint);font-size:12px">（已封存）</span>' : ''}
    </div>
    <div style="text-align:center;padding:18px 14px;background:var(--card);border-radius:var(--radius-card);box-shadow:var(--shadow);margin-bottom:14px">
      <div style="font-size:12px;color:var(--ink-soft)">目前餘額（${scopeLabel}）</div>
      <div style="font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:${balColor};letter-spacing:-0.02em">
        ${balSign}${formatMoney(totalBalance)}
      </div>
      ${contribHTML}
      ${acc.purpose ? `<div style="font-size:12px;color:var(--ink-faint);margin-top:6px">用途：${escapeHTML(acc.purpose)}</div>` : ''}
      ${acc.bank ? `<div style="font-size:12px;color:var(--ink-faint)">${escapeHTML(acc.bank)}</div>` : ''}
    </div>
    <div style="margin-bottom:8px;font-size:13px;color:var(--ink-soft)">共 ${allEntries.length} 筆紀錄（點擊可編輯）</div>
    ${entriesHTML}
    <div class="modal-actions">
      <button class="btn" id="ad-close">關閉</button>
      <button class="btn btn-primary" id="ad-spend" ${acc.archived ? 'disabled' : ''}>從此帳戶花一筆</button>
    </div>
  `;
  const modal = openModal(html);

  modal.querySelector('#ad-close').addEventListener('click', closeModal);

  modal.querySelector('#ad-spend').addEventListener('click', () => {
    // 切到記帳頁，draft 預填為支出+此帳戶；紀錄會進當前帳本
    state.ui.tab = 'record';
    state.ui.draft = {
      ...emptyDraft(),
      type: 'expense',
      account: accId
    };
    closeModal();
    renderTabbar();
    renderMain();
    toast(`目前在「${state.currentBook}」帳本記，要換帳本請點 Header 切換`);
  });

  modal.querySelectorAll('.entry-item').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      closeModal();
      openEntryEditor(id);
    });
  });
}

function renderAccountDetailEntry(e, accId, showBook) {
  let sign, cls, icon, title;
  if (e.type === 'transfer') {
    if (e.fromAccount === accId) {
      const to = findAccount(e.toAccount);
      sign = '−'; cls = 'expense'; icon = '↗';
      title = `轉出至 ${escapeHTML(to?.name || '?')}`;
    } else {
      const from = findAccount(e.fromAccount);
      sign = '+'; cls = 'income'; icon = '↙';
      title = `從 ${escapeHTML(from?.name || '?')} 轉入`;
    }
    if (e.transferPurpose) title += ` · ${escapeHTML(e.transferPurpose)}`;
  } else if (e.type === 'income') {
    sign = '+'; cls = 'income';
    const cat = findCat('income', e.category);
    icon = cat?.emoji || '➕';
    title = `${escapeHTML(cat?.name || '收入')}${e.subcategory ? ' · ' + escapeHTML(e.subcategory) : ''}`;
  } else {
    sign = '−'; cls = 'expense';
    const cat = findCat('expense', e.category);
    icon = cat?.emoji || '➖';
    title = `${escapeHTML(cat?.name || '支出')}${e.subcategory ? ' · ' + escapeHTML(e.subcategory) : ''}`;
  }
  const noteText = e.note ? escapeHTML(e.note) : '';
  const schedTag = e.scheduleId ? ' <span class="entry-tag">排程</span>' : '';
  const bookTag = (showBook && e._book) ? ` <span class="entry-tag" style="background:var(--accent-soft);color:var(--accent)">${escapeHTML(e._book)}</span>` : '';
  return `
    <div class="entry-item" data-id="${e.id}">
      <div class="entry-emoji">${icon}</div>
      <div class="entry-body">
        <div class="entry-title">${e.date.slice(5).replace('-','/')} · ${title}${bookTag}${schedTag}</div>
        ${noteText ? `<div class="entry-note">${noteText}</div>` : ''}
      </div>
      <div class="entry-amount ${cls}">${sign}${formatMoney(e.amount)}</div>
    </div>
  `;
}

async function onClickSyncTest() {
  const url = document.getElementById('sync-url').value.trim();
  const secret = document.getElementById('sync-secret').value.trim();
  if (!url || !secret) { toast('請先填 URL 與 Secret'); return; }
  toast('測試中…');
  const res = await pingEndpoint(url, secret);
  if (res && res.ok && res.data === 'pong') {
    toast('✅ 連線成功');
  } else {
    const msg = (res && res.error) ? res.error : '連線失敗';
    toast('❌ ' + msg);
  }
}

async function onClickSyncSave() {
  const url = document.getElementById('sync-url').value.trim();
  const secret = document.getElementById('sync-secret').value.trim();
  if (!url || !secret) { toast('請先填 URL 與 Secret'); return; }
  if (!/^https:\/\/script\.google\.com\//.test(url)) {
    toast('URL 看起來不像 Apps Script Web App，請確認');
    return;
  }
  const wasEnabled = syncEnabled();
  // 先 ping 一次
  toast('連線測試中…');
  const ping = await pingEndpoint(url, secret);
  if (!(ping && ping.ok && ping.data === 'pong')) {
    toast('❌ 連線失敗：' + ((ping && ping.error) || 'unknown'));
    return;
  }
  state.sync.endpointUrl = url;
  state.sync.apiSecret = secret;
  state.sync.enabled = true;
  state.sync.lastError = null;
  saveSyncState();
  renderHeader();
  renderMain();
  toast('✅ 已儲存設定');

  // 首次啟用：若本機有資料、雲端為空 → 提示批次上傳
  if (!wasEnabled) {
    const totalLocal = countAllEntries();
    if (totalLocal > 0) {
      const remoteCount = await getRemoteCount(url, secret);
      if (remoteCount === 0) {
        openConfirm(`本機有 ${totalLocal} 筆紀錄，雲端為空。要全部上傳嗎？`, () => {
          batchUploadAll();
        });
      } else if (remoteCount > 0) {
        toast(`雲端已有 ${remoteCount} 筆，未自動上傳避免重複`);
      }
    }
  }
  setTimeout(() => syncNow({ showToast: false, force: true }), 0);
}

async function batchUploadAll() {
  if (!syncEnabled()) return;
  const list = collectAllEntriesWithBook();
  if (!list.length) { toast('沒有資料可上傳'); return; }

  const CHUNK = 50;
  let inserted = 0, skipped = 0, errors = 0;
  toast(`開始上傳 ${list.length} 筆…`);

  for (let i = 0; i < list.length; i += CHUNK) {
    const slice = list.slice(i, i + CHUNK);
    const payload = slice.map(({ entry, book }) => toCloudPayload(entry, book));
    try {
      const res = await fetch(state.sync.endpointUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          secret: state.sync.apiSecret,
          action: 'appendBatch',
          payload: payload
        }),
        redirect: 'follow'
      });
      const data = await res.json();
      if (data.ok) {
        inserted += data.data.inserted || 0;
        skipped += data.data.skipped || 0;
        errors += (data.data.errors || []).length;
      } else {
        errors += slice.length;
        state.sync.lastError = data.error || 'batch failed';
      }
    } catch (err) {
      errors += slice.length;
      state.sync.lastError = err.message;
      break;
    }
  }
  state.sync.lastSyncedAt = Date.now();
  saveSyncState();
  renderMain();
  toast(`✅ 上傳完成：成功 ${inserted}、跳過 ${skipped}、失敗 ${errors}`);
}

async function onClickSyncBatchUpload() {
  if (!syncEnabled()) { toast('請先儲存雲端設定'); return; }
  openConfirm(`要把本機 ${countAllEntries()} 筆紀錄全部上傳到雲端嗎？\n（重複 id 會自動跳過）`, () => {
    batchUploadAll();

async function restoreFromCloud() {
  toast('從雲端拉取中…');
  try {
    const res = await fetch(state.sync.endpointUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        secret: state.sync.apiSecret,
        action: 'getEntries',
        payload: {}
      }),
      redirect: 'follow'
    });
    const data = await res.json();
    if (!(data && data.ok)) {
      toast('❌ 拉取失敗：' + (data.error || 'unknown'));
      return;
    }
    const entries = (data.data && data.data.entries) || [];
    const restored = applyRestoredEntries(entries);
    saveState();
    state.sync.lastSyncedAt = Date.now();
    state.sync.pendingQueue = []; // 還原後清掉待送（避免重送）
    saveSyncState();
    renderHeader();
    renderMain();
    toast(`✅ 已還原 ${restored.total} 筆（新增 ${restored.newAccounts} 個帳戶、${restored.newBooks} 本帳本）`);
  } catch (err) {
    toast('❌ 拉取錯誤：' + err.message);
  }
}

// 把雲端中文欄位轉回 PWA 內部結構，並覆寫 state.entries（災難復原專用）
function applyRestoredEntries(entries) {
  const counters = { newAccounts: 0, newBooks: 0 };
  let total = 0;

  // 清空現有 entries（保留 books/accounts/schedules）
  for (const b of state.books) state.entries[b] = [];

  for (const row of entries) {
    const item = cloudRowToLocal(row, counters);
    if (!item) continue;
    state.entries[item.book].push(item.entry);
    total++;
  }
  ensureDefaultAccount();
  return { total, ...counters };
}

// 共用的「新增帳本」小視窗。onDone(name) — 成功時帶名字，取消時帶 null
function openBookAddModal(onDone) {
  const html = `
    <div class="modal-title">新增帳本</div>
    <div class="form-field">
      <label>名稱</label>
      <input id="bab-name" type="text" maxlength="20" placeholder="例如：夢想帳戶">
    </div>
    <div class="modal-actions">
      <button class="btn" id="bab-cancel">取消</button>
      <button class="btn btn-primary" id="bab-save">新增</button>
    </div>
  `;
  const modal = openModal(html, { top: true });
  const input = modal.querySelector('#bab-name');
  setTimeout(() => input.focus(), 100);

  const submit = () => {
    const name = input.value.trim();
    if (!name) { toast('請輸入帳本名稱'); return; }
    if (state.books.includes(name)) { toast('已有同名帳本'); return; }
    if (name.length > 20) { toast('名稱最多 20 字'); return; }
    state.books.push(name);
    state.entries[name] = [];
    saveState();
    closeModal();
    toast(`已新增「${name}」`);
    if (onDone) onDone(name);
  };

  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); submit(); }
  });
  modal.querySelector('#bab-cancel').addEventListener('click', () => {
    closeModal();
    if (onDone) onDone(null);
  });
  modal.querySelector('#bab-save').addEventListener('click', submit);
}

      openConfirm(`刪除「${target}」會清掉 ${cnt} 筆資料，無法復原。確定？`, () => {
        const idx = state.books.indexOf(target);

          state.currentBook = state.books[0];

        saveState();
        renderHeader();
        renderMain();
        closeModal();
        toast(`已刪除「${target}」`);
        if (state.books.length) openBookManager();

    meta.push(getAccountTypeName(a.type));
    if (a.bank) meta.push(escapeHTML(a.bank));

    return `
      <div class="acc-list-item">
        <div class="info">

            <span>${getAccountIcon(a.type)}</span>

            ? `<button class="btn btn-ghost" data-unarchive-acc="${a.id}">啟用</button>`
            : `<button class="btn btn-danger" data-archive-acc="${a.id}">${usage > 0 ? '封存' : '刪除'}</button>`}

  });

    b.addEventListener('click', () => {
      openAccountEditor(b.dataset.editAcc, () => openAccountManager());
    });
  });
  modal.querySelectorAll('[data-archive-acc]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.archiveAcc;
      const acc = findAccount(id);
      if (!acc) return;
      const usage = countEntriesUsingAccount(id);
      if (usage === 0) {
        openConfirm(`刪除帳戶「${acc.name}」？`, () => {
          state.accounts = state.accounts.filter(x => x.id !== id);
          if (acc.isDefault) {
            const next = getActiveAccounts()[0];
            if (next) next.isDefault = true;
          }
          saveState();
          toast('已刪除');
          openAccountManager();
        });
      } else {
        openConfirm(`此帳戶有 ${usage} 筆紀錄。封存後不再出現於選擇器，但歷史紀錄保留。確認？`, () => {
          acc.archived = true;
          if (acc.isDefault) {
            acc.isDefault = false;
            const next = getActiveAccounts()[0];
            if (next) next.isDefault = true;
          }
          saveState();
          toast('已封存');
          openAccountManager();
        });
      }
    });
  });
  modal.querySelectorAll('[data-unarchive-acc]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.unarchiveAcc;
      const acc = findAccount(id);
      if (!acc) return;
      acc.archived = false;
      saveState();
      toast('已啟用');
      openAccountManager();
    });
  });
}

function openAccountEditor(id, onDone) {
  const isEdit = !!id;
  const acc = isEdit ? findAccount(id) : { name: '', type: 'checking', bank: '', purpose: '', isDefault: state.accounts.length === 0 };
  if (isEdit && !acc) return;

  const typeOptions = ACCOUNT_TYPES.map(t =>
    `<option value="${t.id}" ${t.id === acc.type ? 'selected' : ''}>${t.emoji} ${escapeHTML(t.name)}</option>`
  ).join('');

  const html = `
    <div class="modal-title">${isEdit ? '編輯帳戶' : '新增帳戶'}</div>
    <div class="form-field">
      <label>名稱</label>
      <input id="ae-name" type="text" maxlength="20" value="${escapeHTML(acc.name || '')}" placeholder="例如：華南儲蓄">
    </div>
    <div class="form-field">
      <label>類型</label>
      <select id="ae-type">${typeOptions}</select>
    </div>
    <div class="form-field">
      <label>銀行（可選）</label>
      <input id="ae-bank" type="text" maxlength="20" value="${escapeHTML(acc.bank || '')}" placeholder="例如：華南銀行">
    </div>
    <div class="form-field">
      <label>用途說明（可選）</label>
      <input id="ae-purpose" type="text" maxlength="30" value="${escapeHTML(acc.purpose || '')}" placeholder="例如：大型支出基金">
    </div>
    <div class="form-field">
      <label class="checkbox-row">
        <input type="checkbox" id="ae-default" ${acc.isDefault ? 'checked' : ''}>
        <span>設為預設帳戶（新增記錄時自動選中）</span>
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn" id="ae-cancel">取消</button>
      <button class="btn btn-primary" id="ae-save">儲存</button>
    </div>
  `;
  const modal = openModal(html, { top: true });

  modal.querySelector('#ae-cancel').addEventListener('click', () => {
    closeModal();
    if (onDone) onDone();
  });

  modal.querySelector('#ae-save').addEventListener('click', () => {
    const name = modal.querySelector('#ae-name').value.trim();
    const type = modal.querySelector('#ae-type').value;
    const bank = modal.querySelector('#ae-bank').value.trim();
    const purpose = modal.querySelector('#ae-purpose').value.trim();
    const isDefault = modal.querySelector('#ae-default').checked;
    if (!name) { toast('請輸入帳戶名稱'); return; }
    if (state.accounts.some(a => a.id !== (isEdit ? id : null) && a.name === name)) {
      toast('已有同名帳戶');
      return;
    }
    let createdId = null;
    if (isEdit) {
      Object.assign(acc, { name, type, bank, purpose });
      if (isDefault) ensureSingleDefault(id);
      else if (acc.isDefault) acc.isDefault = false;
    } else {
      const newAcc = { id: genId('acc'), name, type, bank, purpose };
      state.accounts.push(newAcc);
      createdId = newAcc.id;
      if (isDefault || state.accounts.length === 1) ensureSingleDefault(newAcc.id);
    }
    // 若沒有任何 default，補一個
    if (!state.accounts.some(a => a.isDefault && !a.archived)) {
      const next = getActiveAccounts()[0];
      if (next) next.isDefault = true;
    }
    saveState();
    closeModal();
    toast(isEdit ? '已更新' : '已新增');
    if (onDone) onDone(createdId);
  });
}

/* ===================================================
 * 排程管理 modal
 * =================================================== */
function describeScheduleFlow(s) {
  if (s.type === 'transfer') {
    const from = findAccount(s.fromAccount);
    const to = findAccount(s.toAccount);
    return `↔️ ${from?.name || '?'} → ${to?.name || '?'}`;
  }
  const cat = findCat(s.type, s.category);
  const acc = findAccount(s.account);
  const catText = cat ? `${cat.emoji} ${cat.name}` : '';
  const subText = s.subcategory ? ` · ${s.subcategory}` : '';
  const accText = acc ? ` @ ${acc.name}` : '';
  return `${s.type === 'expense' ? '−' : '+'} ${catText}${subText}${accText}`;
}

function openScheduleManager() {
  const items = state.schedules.map(s => `
    <div class="schedule-list-item">
      <div class="info">
        <div class="name">
          <span>${escapeHTML(s.name)}</span>
          ${s.active ? '<span class="badge">啟用</span>' : '<span class="badge inactive">停用</span>'}
        </div>
        <div class="meta">
          ${escapeHTML(describeScheduleFlow(s))}<br>
          NT$ ${formatMoney(s.amount)} · 每月 ${s.dayOfMonth} 號 · 帳本：${escapeHTML(s.book)}<br>
          下次到期：${s.nextDue || '—'}${s.lastExecuted ? ` · 上次：${s.lastExecuted}` : ''}
        </div>
      </div>
      <div class="actions">
        <button class="btn" data-edit-sched="${s.id}">編輯</button>
        <button class="btn btn-ghost" data-toggle-sched="${s.id}">${s.active ? '停用' : '啟用'}</button>
        <button class="btn btn-danger" data-del-sched="${s.id}">刪除</button>
      </div>
    </div>
  `).join('');

  const html = `
    <div class="modal-title">定期扣款 / 排程</div>
    ${items || '<div class="empty-state" style="padding:20px 10px;font-size:13px;line-height:1.7">尚未建立定期扣款<br>例如：每月 5 號從現金撥 15,000 到夢想帳戶</div>'}
    <div class="modal-actions">
      <button class="btn" id="sm-close">關閉</button>
      <button class="btn btn-primary" id="sm-add">＋ 新增定期扣款</button>
    </div>
  `;
  const modal = openModal(html);
  modal.querySelector('#sm-close').addEventListener('click', closeModal);
  modal.querySelector('#sm-add').addEventListener('click', () => {
    openScheduleEditor(null, () => openScheduleManager());
  });
  modal.querySelectorAll('[data-edit-sched]').forEach(b => {
    b.addEventListener('click', () => {
      openScheduleEditor(b.dataset.editSched, () => openScheduleManager());
    });
  });
  modal.querySelectorAll('[data-toggle-sched]').forEach(b => {
    b.addEventListener('click', () => {
      const s = state.schedules.find(x => x.id === b.dataset.toggleSched);
      if (!s) return;
      s.active = !s.active;
      saveState();
      openScheduleManager();
    });
  });
  modal.querySelectorAll('[data-del-sched]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.delSched;
      const s = state.schedules.find(x => x.id === id);
      if (!s) return;
      openConfirm(`刪除排程「${s.name}」？`, () => {
        state.schedules = state.schedules.filter(x => x.id !== id);
        saveState();
        toast('已刪除');
        openScheduleManager();
      });
    });
  });
}

function openScheduleEditor(id, onDone, template) {
  const isEdit = !!id;
  const def = getDefaultAccount();
  const baseDefault = {
    name: '',
    type: 'transfer',
    fromAccount: def?.id || null,
    toAccount: null,
    account: def?.id || null,
    category: null,
    subcategory: null,
    amount: 0,
    dayOfMonth: new Date().getDate(),
    book: state.currentBook,
    note: '',
    active: true
  };
  const s = isEdit
    ? state.schedules.find(x => x.id === id)
    : { ...baseDefault, ...(template || {}) };
  if (isEdit && !s) return;

  function renderBody(working) {
    const active = getActiveAccounts();
    const typeBtns = `
      <div class="type-switch" style="margin:0">
        <button class="${working.type === 'transfer' ? 'active transfer' : ''}" data-st-type="transfer">轉帳</button>
        <button class="${working.type === 'expense' ? 'active expense' : ''}" data-st-type="expense">支出</button>
        <button class="${working.type === 'income' ? 'active income' : ''}" data-st-type="income">收入</button>
      </div>
    `;

    let typeFields = '';
    if (working.type === 'transfer') {
      const fromOptions = active.map(a => `<option value="${a.id}" ${a.id === working.fromAccount ? 'selected' : ''}>${getAccountIcon(a.type)} ${escapeHTML(a.name)}</option>`).join('');
      const toOptions = active.map(a => `<option value="${a.id}" ${a.id === working.toAccount ? 'selected' : ''}>${getAccountIcon(a.type)} ${escapeHTML(a.name)}</option>`).join('');
      const purposeOptions = `<option value="">（無）</option>` + TRANSFER_PURPOSES.map(p =>
        `<option value="${escapeHTML(p)}" ${p === working.transferPurpose ? 'selected' : ''}>${escapeHTML(p)}</option>`
      ).join('');
      typeFields = `
        <div class="form-field"><label>從帳戶</label><select id="se-from">${fromOptions}</select></div>
        <div class="form-field"><label>到帳戶</label><select id="se-to">${toOptions}</select></div>
        <div class="form-field"><label>目的</label><select id="se-purpose">${purposeOptions}</select></div>
      `;
    } else {
      const cats = CATS[working.type];
      const catId = working.category || cats[0].id;
      const subs = getSubcategories(working.type, catId);
      const catOptions = cats.map(c => `<option value="${c.id}" ${c.id === catId ? 'selected' : ''}>${c.emoji} ${escapeHTML(c.name)}</option>`).join('');
      const subOptions = subs.length
        ? `<option value="">（無）</option>` + subs.map(sb => `<option value="${escapeHTML(sb)}" ${sb === working.subcategory ? 'selected' : ''}>${escapeHTML(sb)}</option>`).join('')
        : '';
      const accOptions = active.map(a => `<option value="${a.id}" ${a.id === working.account ? 'selected' : ''}>${getAccountIcon(a.type)} ${escapeHTML(a.name)}</option>`).join('');
      typeFields = `
        <div class="form-field"><label>分類</label><select id="se-cat">${catOptions}</select></div>
        <div class="form-field" id="se-sub-wrap" ${subs.length ? '' : 'style="display:none"'}><label>細項</label><select id="se-sub">${subOptions}</select></div>
        <div class="form-field"><label>帳戶</label><select id="se-acc">${accOptions}</select></div>
      `;
    }

    const bookOptions = state.books.map(b => `<option value="${escapeHTML(b)}" ${b === working.book ? 'selected' : ''}>${escapeHTML(b)}</option>`).join('');

    return `
      <div class="modal-title">${isEdit ? '編輯排程' : '新增排程'}</div>
      <div class="form-field">
        <label>名稱</label>
        <input id="se-name" type="text" maxlength="30" value="${escapeHTML(working.name || '')}" placeholder="例如：每月撥華南儲蓄">
      </div>
      <div class="form-field">
        <label>類型</label>
        ${typeBtns}
      </div>
      ${typeFields}
      <div class="form-field">
        <label>金額</label>
        <input id="se-amount" type="number" inputmode="numeric" min="1" max="9999999" value="${working.amount || ''}" placeholder="例如：15000">
      </div>
      <div class="form-field">
        <label>每月幾號（1-31，超過該月最後一天時自動使用最後一天）</label>
        <input id="se-day" type="number" inputmode="numeric" min="1" max="31" value="${working.dayOfMonth || 1}">
      </div>
      <div class="form-field">
        <label>帳本</label>
        <select id="se-book">${bookOptions}</select>
      </div>
      <div class="form-field">
        <label>預設備註（可選）</label>
        <input id="se-note" type="text" maxlength="${MAX_NOTE_LEN}" value="${escapeHTML(working.note || '')}" placeholder="例如：每月固定撥款">
      </div>
      <div class="modal-actions">
        <button class="btn" id="se-cancel">取消</button>
        <button class="btn btn-primary" id="se-save">儲存</button>
      </div>
    `;
  }

  function attach(modal, working) {
    modal.innerHTML = renderBody(working);

    function collect() {
      const out = {
        name: modal.querySelector('#se-name').value.trim(),
        type: working.type,
        amount: parseInt(modal.querySelector('#se-amount').value, 10) || 0,
        dayOfMonth: Math.min(31, Math.max(1, parseInt(modal.querySelector('#se-day').value, 10) || 1)),
        book: modal.querySelector('#se-book').value,
        note: modal.querySelector('#se-note').value.slice(0, MAX_NOTE_LEN),
        active: working.active !== false
      };
      if (working.type === 'transfer') {
        out.fromAccount = modal.querySelector('#se-from').value;
        out.toAccount = modal.querySelector('#se-to').value;
        out.transferPurpose = modal.querySelector('#se-purpose').value || null;
      } else {
        out.account = modal.querySelector('#se-acc').value;
        out.category = modal.querySelector('#se-cat').value;
        out.subcategory = (modal.querySelector('#se-sub') && modal.querySelector('#se-sub').value) || null;
      }
      return out;
    }

    modal.querySelectorAll('[data-st-type]').forEach(b => {
      b.addEventListener('click', () => {
        const t = b.dataset.stType;
        if (t === working.type) return;
        const cur = collect();
        // 保留 name, amount, dayOfMonth, book, note
        const next = {
          ...working,
          name: cur.name,
          amount: cur.amount,
          dayOfMonth: cur.dayOfMonth,
          book: cur.book,
          note: cur.note,
          type: t
        };
        const def = getDefaultAccount();
        if (t === 'transfer') {
          next.fromAccount = working.account || def?.id || null;
          next.toAccount = null;
          next.transferPurpose = null;
          delete next.account;
          delete next.category;
          delete next.subcategory;
        } else {
          next.account = working.fromAccount || def?.id || null;
          next.category = CATS[t][0].id;
          next.subcategory = null;
          delete next.fromAccount;
          delete next.toAccount;
          delete next.transferPurpose;
        }
        attach(modal, next);
      });
    });

    // 切換大分類 → 重填細項
    const catSel = modal.querySelector('#se-cat');
    if (catSel) {
      catSel.addEventListener('change', () => {
        const newSubs = getSubcategories(working.type, catSel.value);
        const wrap = modal.querySelector('#se-sub-wrap');
        if (newSubs.length) {
          wrap.style.display = '';
          modal.querySelector('#se-sub').innerHTML = `<option value="">（無）</option>` + newSubs.map(s => `<option value="${escapeHTML(s)}">${escapeHTML(s)}</option>`).join('');
        } else {
          wrap.style.display = 'none';
        }
      });
    }

    modal.querySelector('#se-cancel').addEventListener('click', () => {
      closeModal();
      if (onDone) onDone();
    });

    modal.querySelector('#se-save').addEventListener('click', () => {
      const cur = collect();
      if (!cur.name) { toast('請輸入名稱'); return; }
      if (!(cur.amount > 0) || cur.amount > 9999999) { toast('金額需為 1 到 9999999'); return; }
      if (cur.dayOfMonth < 1 || cur.dayOfMonth > 31) { toast('日期需為 1-31'); return; }
      if (cur.type === 'transfer') {
        if (!cur.fromAccount || !cur.toAccount) { toast('請選擇從/到帳戶'); return; }
        if (cur.fromAccount === cur.toAccount) { toast('從與到帳戶不可相同'); return; }
      } else {
        if (!cur.account) { toast('請選擇帳戶'); return; }
        if (!cur.category) { toast('請選擇分類'); return; }
      }

      if (isEdit) {
        // 保留 lastExecuted；若 dayOfMonth 改了重新計算 nextDue
        const dayChanged = (cur.dayOfMonth !== s.dayOfMonth);
        Object.assign(s, cur);
        if (dayChanged || !s.nextDue) {
          s.nextDue = computeInitialNextDue(cur.dayOfMonth, s.lastExecuted ? advanceNextDue(s.lastExecuted, cur.dayOfMonth) : null);
        }
      } else {
        const newSched = {
          id: genId('sch'),
          ...cur,
          lastExecuted: null,
          nextDue: computeInitialNextDue(cur.dayOfMonth, null)
        };
        state.schedules.push(newSched);
      }
      saveState();
      closeModal();
      toast(isEdit ? '已更新' : '已建立');
      if (onDone) onDone();
    });
  }

  const modal = openModal('', { top: true });
  attach(modal, { ...s });
}

function executeSchedule(sched, overrides) {
  const amount = (overrides && overrides.amount) || sched.amount;
  const date = (overrides && overrides.date) || sched.nextDue || todayISO();
  const note = (overrides && overrides.note != null) ? overrides.note : (sched.note || '');
  const targetBook = state.books.includes(sched.book) ? sched.book : state.currentBook;

  let entry;
  if (sched.type === 'transfer') {
    entry = {
      id: genId(),
      type: 'transfer',
      amount,
      fromAccount: sched.fromAccount,
      toAccount: sched.toAccount,
      transferPurpose: sched.transferPurpose || null,
      note,
      date,
      createdAt: Date.now(),
      scheduleId: sched.id
    };
  } else {
    entry = {
      id: genId(),
      type: sched.type,
      amount,
      category: sched.category,
      subcategory: sched.subcategory || null,
      account: sched.account,
      note,
      date,
      createdAt: Date.now(),
      scheduleId: sched.id
    };
  }

  if (!state.entries[targetBook]) state.entries[targetBook] = [];
  state.entries[targetBook].push(entry);

  sched.lastExecuted = todayISO();
  sched.nextDue = advanceNextDue(sched.nextDue || todayISO(), sched.dayOfMonth);

  saveState();
  syncDispatch('append', toCloudPayload(entry, targetBook));
  toast(`已建立「${sched.name}」`);
  renderMain();
}

/* ===================================================
 * CSV 匯出
 * =================================================== */
function csvEscape(s) {
  s = String(s == null ? '' : s);
  if (/[",\r\n]/.test(s)) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function entryToCSVRow(e, book) {
  const { weekday } = isoToParts(e.date);
  if (e.type === 'transfer') {
    const from = findAccount(e.fromAccount);
    const to = findAccount(e.toAccount);
    const noteParts = [];
    if (e.transferPurpose) noteParts.push(`(${e.transferPurpose})`);
    if (e.note) noteParts.push(e.note);
    return [
      e.date,
      weekday,
      '',
      '',
      noteParts.join(' '),
      '轉帳',
      e.amount,
      book,
      '',
      from ? from.name : (e.fromAccount || ''),
      to ? to.name : (e.toAccount || ''),
      e.scheduleId || ''
    ].map(csvEscape).join(',');
  }
  const cat = findCat(e.type, e.category);
  const catName = cat?.name || e.category || '';
  const typeText = e.type === 'expense' ? '支出' : '收入';
  const acc = findAccount(e.account);
  return [
    e.date,
    weekday,
    catName,
    e.subcategory || '',
    e.note || '',
    typeText,
    e.amount,
    book,
    acc ? acc.name : (e.account || ''),
    '',
    '',
    e.scheduleId || ''
  ].map(csvEscape).join(',');
}

function exportCSV(scope) {
  const book = state.currentBook;
  const all = state.entries[book] || [];
  const list = (scope === 'month')
    ? all.filter(e => e.date && e.date.startsWith(state.ui.viewMonth))
    : all;
  if (!list.length) {
    toast('沒有資料可匯出');
    return;
  }
  const header = '日期,星期,類別,細項,備註,收支,金額,帳本,帳戶,從帳戶,到帳戶,排程ID';
  const rows = list
    .slice()
    .sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt)
    .map(e => entryToCSVRow(e, book));
  const csv = header + '\r\n' + rows.join('\r\n') + '\r\n';
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const fname = (scope === 'month')
    ? `記帳_${book}_${state.ui.viewMonth}.csv`
    : `記帳_${book}_全部.csv`;
  const a = document.createElement('a');
  a.href = url;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 500);
  toast(`已匯出 ${list.length} 筆`);
}

/* ===================================================
 * CSV 匯入（v1.0 8 欄 / v1.1 12 欄 皆相容）
 * =================================================== */
function handleImportFile(ev) {
  const file = ev.target.files?.[0];
  ev.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const text = String(reader.result || '').replace(/^﻿/, '');
      parseAndConfirmCSV(text);
    } catch (err) {
      console.error(err);
      toast('匯入失敗');
    }
  };
  reader.onerror = () => toast('讀取檔案失敗');
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let inQuote = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuote) {
      if (ch === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; }
        else inQuote = false;
      } else {
        cell += ch;
      }
    } else {
      if (ch === '"') inQuote = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (ch === '\r') { /* skip */ }
      else cell += ch;
    }
  }
  if (cell.length > 0 || row.length > 0) {
    row.push(cell);
    rows.push(row);
  }
  return rows.filter(r => r.some(c => c.length > 0));
}

function parseAndConfirmCSV(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('CSV 沒有資料'); return; }
  const header = rows[0].map(h => h.trim());

  const required = ['日期','類別','收支','金額'];
  for (const r of required) {
    if (header.indexOf(r) < 0) { toast(`CSV 缺少必要欄位：${r}`); return; }
  }
  const colIdx = {};
  ['日期','星期','類別','細項','備註','收支','金額','帳本','帳戶','從帳戶','到帳戶','排程ID'].forEach(name => {
    colIdx[name] = header.indexOf(name);
  });

  const def = getDefaultAccount();
  const defId = def ? def.id : 'acc_cash';

  const parsed = [];
  const skipped = [];
  let warnings = 0;

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const get = (name) => colIdx[name] >= 0 ? (r[colIdx[name]] || '').trim() : '';
    const date = get('日期');
    const catName = get('類別');
    const subVal = get('細項');
    const note = get('備註');
    const typeText = get('收支');
    const amountText = get('金額');
    const accName = get('帳戶');
    const fromName = get('從帳戶');
    const toName = get('到帳戶');
    const schedId = get('排程ID');
    const amount = parseInt(amountText.replace(/[^\d-]/g, ''), 10);

    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { skipped.push({ row: i, reason: '日期格式錯' }); continue; }
    if (!(amount > 0) || amount > 9999999) { skipped.push({ row: i, reason: '金額無效' }); continue; }

    let type;
    if (typeText === '轉帳') type = 'transfer';
    else if (typeText === '收入') type = 'income';
    else if (typeText === '支出') type = 'expense';
    else { skipped.push({ row: i, reason: '收支欄錯' }); continue; }

    if (type === 'transfer') {
      let fromId = null, toId = null;
      if (fromName) {
        const a = findAccountByName(fromName);
        if (a) fromId = a.id; else { fromId = defId; warnings++; }
      } else { fromId = defId; }
      if (toName) {
        const a = findAccountByName(toName);
        if (a) toId = a.id; else { toId = defId; warnings++; }
      } else { toId = defId; }
      if (!fromId || !toId || fromId === toId) {
        skipped.push({ row: i, reason: '轉帳的從/到帳戶無法決定' });
        continue;
      }
      parsed.push({
        id: genId(),
        type: 'transfer',
        amount,
        fromAccount: fromId,
        toAccount: toId,
        transferPurpose: null,
        note: note.slice(0, MAX_NOTE_LEN),
        date,
        createdAt: Date.now() + i,
        scheduleId: schedId || undefined
      });
      continue;
    }

    // 支出 / 收入
    let cat = findCatByName(type, catName);
    if (!cat) {
      cat = findCat(type, type === 'expense' ? 'other' : 'other_in');
      warnings++;
    }
    let accountId = null;
    if (accName) {
      const a = findAccountByName(accName);
      if (a) accountId = a.id; else { accountId = defId; warnings++; }
    } else {
      accountId = defId;
    }

    parsed.push({
      id: genId(),
      type,
      amount,
      category: cat.id,
      subcategory: subVal || null,
      account: accountId,
      note: note.slice(0, MAX_NOTE_LEN),
      date,
      createdAt: Date.now() + i,
      scheduleId: schedId || undefined
    });
  }

  if (!parsed.length) {
    toast(`無有效資料可匯入（${skipped.length} 列被跳過）`);
    return;
  }

  openConfirm(`將匯入 ${parsed.length} 筆到「${state.currentBook}」，繼續嗎？`, () => {
    state.entries[state.currentBook].push(...parsed);
    saveState();
    renderMain();
    let msg = `成功匯入 ${parsed.length} 筆`;
    if (warnings) msg += `（其中 ${warnings} 筆有警告）`;
    if (skipped.length) msg += `，跳過 ${skipped.length} 筆`;
    toast(msg);
  });
}

/* ===================================================
 * 清空帳本（二次確認，需打字「刪除」）
 * =================================================== */
function confirmClearBook() {
  const book = state.currentBook;
  const cnt = (state.entries[book] || []).length;
  if (!cnt) { toast('當前帳本沒有資料'); return; }

  const html = `
    <div class="modal-title">清空「${escapeHTML(book)}」？</div>
    <div style="color:var(--ink-soft);font-size:13px;text-align:center;line-height:1.7;margin-bottom:10px">
      將刪除 ${cnt} 筆資料，無法復原。<br>
      請輸入「<strong style="color:var(--expense)">刪除</strong>」二字確認。
    </div>
    <input id="clear-input" type="text" placeholder="輸入「刪除」" style="width:100%;text-align:center;font-size:15px">
    <div class="modal-actions">
      <button class="btn" id="clear-cancel">取消</button>
      <button class="btn btn-danger" id="clear-yes" disabled>確認清空</button>
    </div>
  `;
  const modal = openModal(html, { top: true });
  const input = modal.querySelector('#clear-input');
  const yes = modal.querySelector('#clear-yes');
  input.addEventListener('input', () => {
    yes.disabled = (input.value.trim() !== '刪除');
  });
  modal.querySelector('#clear-cancel').addEventListener('click', closeModal);
  yes.addEventListener('click', () => {
    state.entries[book] = [];
    saveState();
    closeModal();
    renderMain();
    toast('已清空');
  });
  setTimeout(() => input.focus(), 100);
}

/* ===================================================
 * 啟動
 * =================================================== */
function init() {
  loadState();
  loadSyncState();
  renderHeader();
  renderTabbar();
  renderMain();
  // 排程到期檢查
  setTimeout(checkScheduleDue, 50);

  // 上線後先補送 queue，再拉回雲端更新
  window.addEventListener('online', async () => {
    updateSyncBadge();
    await flushQueue();
    syncNow({ showToast: false, force: true });
  });
  window.addEventListener('offline', updateSyncBadge);

  // 每 60 秒補送 queue；每 5 分鐘及切回前景時拉回更新
  setInterval(() => {
    if (navigator.onLine && state.sync.pendingQueue.length > 0) flushQueue();
  }, 60000);
  setInterval(() => {
    if (navigator.onLine) syncNow({ showToast: false });
  }, AUTO_PULL_INTERVAL_MS);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && navigator.onLine) syncNow({ showToast: false });
  });

  // 啟動先補送，再執行一次安全合併
  setTimeout(() => { if (navigator.onLine) syncNow({ showToast: false, force: true }); }, 1500);

  // Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(console.warn);
    });
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
